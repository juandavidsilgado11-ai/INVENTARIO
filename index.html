<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRICOL S.A. — Inventario Semanal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B01E23'/%3E%3Ctext x='16' y='23' font-family='Arial Black' font-size='19' font-weight='900' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script>
(function(){
  if(window.lucide) return;
  var s=document.createElement('script');
  s.src='https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js';
  s.onload=function(){ try{ if(typeof icons==='function') icons(); }catch(e){} };
  document.head.appendChild(s);
})();
</script>
<style>
/* ============ BASE ============ */
:root{
  --r-950:#43060A; --r-900:#5F0A0F; --r-800:#7C0F14; --r-700:#9A141A;
  --r-600:#B01E23; --r-500:#C8231F;
  --ink:#1D1414; --paper:#FFFFFF; --dim:#F7F0EB; --line:#E7DCD6; --mut:#8A7773;
  --amber:#B26A00; --amber-bg:#FFF6E5;
  --fd:'Oswald',sans-serif; --fu:'Archivo',sans-serif; --fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fu);background:var(--r-800);color:var(--ink);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
i[data-lucide]{display:inline-block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--r-600);color:#fff}

/* ============ BOTONES / INPUTS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:600;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:11px 18px;
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;user-select:none}
.btn:hover{background:var(--dim)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--r-600);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--r-500)}
.btn.red{background:var(--r-600);color:#fff}
.btn.small{padding:7px 12px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
.btn.small:active{transform:translate(2px,2px)}
.btn.icon{padding:8px;border:1.5px solid var(--ink);box-shadow:none;background:#fff}
.btn.icon:hover{background:var(--dim)}
.btn.icon.danger:hover{background:var(--r-600);color:#fff;border-color:var(--r-600)}
.btn:disabled{opacity:.4;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.field label b{color:var(--r-600)}
.input{border:1.5px solid var(--ink);background:#fff;padding:10px 12px;outline:none;width:100%;border-radius:0}
.input:focus{border-color:var(--r-600);box-shadow:3px 3px 0 var(--r-600)}
textarea.input{resize:vertical;min-height:64px}
.ferr{font-size:12px;color:var(--r-600);font-weight:600;display:none}
.ferr.show{display:block}

/* ============ LOGIN ============ */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.lg-brand{background:var(--r-800);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-brand::after{content:'G';position:absolute;right:-70px;bottom:-120px;font-family:var(--fd);font-weight:700;font-size:560px;line-height:1;color:var(--r-900);pointer-events:none}
.lg-kicker{font-family:var(--fm);font-size:12px;letter-spacing:.28em;border-bottom:2px solid #fff;padding-bottom:14px;display:inline-block}
.lg-word{font-family:var(--fd);font-weight:700;font-size:clamp(64px,9vw,124px);line-height:.92;letter-spacing:.01em;margin-top:26px;position:relative;z-index:1}
.lg-word small{display:block;font-size:.32em;font-weight:500;letter-spacing:.5em;color:#fff;opacity:.85;margin-top:10px}
.lg-sub{max-width:420px;margin-top:28px;font-size:15px;color:#F3DEDC;position:relative;z-index:1}
.lg-foot{font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:#E8C7C4;position:relative;z-index:1}
.lg-panel{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:40px;border-left:6px solid var(--r-600)}
.lg-card{width:100%;max-width:360px}
.lg-card h2{font-family:var(--fd);font-size:26px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lg-card .rule{height:3px;background:var(--ink);margin:14px 0 26px}
.lg-hint{margin-top:22px;border:1.5px dashed var(--mut);padding:10px 12px;font-family:var(--fm);font-size:12px;color:var(--mut)}
.lg-hint b{color:var(--ink)}
.lg-err{display:none;margin-top:14px;border-left:4px solid var(--r-600);background:#FBEDEC;padding:9px 12px;font-size:13px;font-weight:600;color:var(--r-700)}
.lg-err.show{display:block}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:42px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px;color:var(--mut)}

/* ============ SHELL APP ============ */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--r-950);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:4px solid var(--r-600)}
.sb-logo{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:12px}
.sb-mark{width:38px;height:38px;background:#fff;color:var(--r-600);font-family:var(--fd);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.sb-logo .t1{font-family:var(--fd);font-weight:600;font-size:17px;letter-spacing:.06em;line-height:1.1}
.sb-logo .t2{font-family:var(--fm);font-size:10px;letter-spacing:.24em;color:#E8C7C4}
.sb-nav{flex:1;padding:14px 0;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 20px;color:#F0DCDA;font-family:var(--fd);font-weight:500;font-size:14px;letter-spacing:.09em;text-transform:uppercase;border-left:4px solid transparent}
.nav-btn .n{font-family:var(--fm);font-size:10px;color:#C98F8B;width:18px}
.nav-btn:hover{background:var(--r-900)}
.nav-btn.active{background:#fff;color:var(--r-700);border-left-color:var(--r-600)}
.nav-btn.active .n{color:var(--r-600)}
.nav-btn i{width:17px;height:17px}
.sb-user{border-top:1px solid rgba(255,255,255,.14);padding:16px 20px;display:flex;align-items:center;gap:10px}
.sb-user .av{width:32px;height:32px;background:var(--r-600);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;flex:none}
.sb-user .un{font-family:var(--fm);font-size:12px;letter-spacing:.06em}
.sb-user .rl{font-size:10px;color:#C98F8B;letter-spacing:.14em;text-transform:uppercase}
.sb-exit{margin-left:auto;color:#E8C7C4;padding:6px}
.sb-exit:hover{color:#fff}
.main{background:var(--paper);min-width:0}
.wrap{max-width:1160px;margin:0 auto;padding:38px 44px 80px}

/* Encabezado de sección */
.sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.sec-num{font-family:var(--fm);font-size:13px;color:var(--r-600);font-weight:600}
.sec-head h1{font-family:var(--fd);font-weight:600;font-size:clamp(24px,3vw,34px);letter-spacing:.03em;text-transform:uppercase;line-height:1}
.sec-rule{flex:1;height:3px;background:var(--ink);min-width:60px}
.sec-meta{font-family:var(--fm);font-size:12px;letter-spacing:.1em;color:var(--mut)}

/* ============ PESTAÑAS MANUAL / IMPORTAR ============ */
.modebar{display:flex;border:2px solid var(--ink);width:max-content;max-width:100%;margin-bottom:26px;background:#fff;overflow-x:auto}
.modebar button{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 22px;display:inline-flex;gap:8px;align-items:center;color:var(--mut);white-space:nowrap}
.modebar button.on{background:var(--ink);color:#fff}
.modebar button i{width:15px;height:15px}

/* ============ SELLOS ============ */
.stamp{display:inline-block;font-family:var(--fd);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:3px solid currentColor;padding:.3em .65em;transform:rotate(-3.5deg);filter:url(#rough);background:transparent}
.stamp.big{font-size:clamp(20px,2.4vw,27px)}
.stamp.sm{font-size:11px;border-width:2px;padding:.2em .5em;transform:rotate(-2deg)}
@keyframes stampIn{0%{transform:rotate(-3.5deg) scale(1.7);opacity:0}55%{transform:rotate(-3.5deg) scale(.94);opacity:1}100%{transform:rotate(-3.5deg) scale(1)}}
.stamp.animate{animation:stampIn .28s cubic-bezier(.2,1.4,.4,1)}
.c-fixed{color:var(--ink)} .c-import{color:var(--r-600)} .c-assay{color:var(--r-700)}
.c-move{color:#6B5A56} .c-release{color:var(--r-500)}
.c-excess{color:var(--amber)}

/* ============ ETIQUETAS ============ */
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--fd);font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border:1.5px solid currentColor;white-space:nowrap}
.tag .stripes{width:15px;height:9px;border:1px solid currentColor;background:repeating-linear-gradient(45deg,currentColor 0 2.5px,transparent 2.5px 5.5px)}
.t-fixed{color:var(--ink)} .t-import{background:var(--r-600);border-color:var(--r-600);color:#fff}
.t-assay{color:var(--r-700)} .t-move{color:#5C4C48;background:var(--dim)}
.t-release{color:var(--r-500)} .t-out{color:var(--r-600);border-style:dashed}
.t-excess{background:var(--amber);border-color:var(--amber);color:#fff}

/* ============ PANELES / BANDAS ============ */
.band{display:flex;flex-wrap:wrap;border:2px solid var(--ink);margin-bottom:34px;background:#fff}
.kpi{padding:20px 26px;flex:1 1 150px;border-right:1.5px solid var(--line);min-width:140px}
.kpi:last-child{border-right:none}
.kpi .v{font-family:var(--fd);font-weight:700;font-size:42px;line-height:1}
.kpi .v.alert{color:var(--r-600)}
.kpi .v.amber{color:var(--amber)}
.kpi .l{font-family:var(--fd);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.kpi.hero{flex:2 1 220px;background:var(--r-600);color:#fff;border-right:1.5px solid var(--ink)}
.kpi.hero .l{color:#F6D9D6}
.kpi.hero .v{font-size:56px}
.kpi.hero small{font-family:var(--fm);font-size:12px;letter-spacing:.1em}

.panel{border:2px solid var(--ink);background:#fff;margin-bottom:30px}
.panel-head{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.panel-head .idx{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--r-600)}
.panel-head h3{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.panel-head .spacer{flex:1}
.panel-body{padding:18px}
.empty{padding:34px;text-align:center;color:var(--mut)}
.empty i{width:34px;height:34px;margin-bottom:10px;color:var(--mut)}
.empty p{font-size:14px}

.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:26px;align-items:start}

.alist{list-style:none}
.alist li{display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:none}
.alist .ix{font-family:var(--fm);font-size:12px;color:var(--r-600);font-weight:600;padding-top:3px;width:22px;flex:none}
.alist .body{flex:1;min-width:0}
.alist .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alist .ref{font-family:var(--fm);font-weight:600;font-size:13px}
.alist .why{font-size:12.5px;color:var(--mut);margin-top:3px}
.linkish{font-family:var(--fm);font-size:11.5px;color:var(--r-600);text-decoration:underline;text-underline-offset:3px}

.hbar{display:grid;grid-template-columns:150px 1fr 34px;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.hbar .bl{font-family:var(--fd);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;border:1px solid var(--ink);background:#fff;position:relative}
.hbar .fill{position:absolute;inset:1px auto 1px 1px;background:var(--ink)}
.hbar .fill.f-import{background:var(--r-600)}
.hbar .fill.f-assay{background:var(--r-700)}
.hbar .fill.f-move{background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 7px)}
.hbar .fill.f-release{background:repeating-linear-gradient(45deg,var(--r-500) 0 3px,transparent 3px 7px)}
.hbar .fill.f-excess{background:var(--amber)}
.hbar .bn{font-family:var(--fm);font-size:12px;text-align:right;font-weight:600}

/* ============ FORMULARIO ============ */
.fgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:start}
.fcard{border:2px solid var(--ink);background:#fff;padding:26px}
.frows{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.frows .full{grid-column:1/-1}
.verdict{border:2px solid var(--ink);background:var(--dim);position:sticky;top:24px}
.vd-head{border-bottom:2px solid var(--ink);padding:11px 16px;font-family:var(--fd);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;background:#fff}
.vd-stage{padding:30px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:150px;justify-content:center}
.vd-idle{font-family:var(--fm);font-size:12.5px;color:var(--mut);text-align:center}
.vd-reason{font-size:12.5px;color:var(--mut);text-align:center;max-width:260px}
.vd-excess{margin:0 16px 14px;border-left:4px solid var(--amber);background:var(--amber-bg);padding:9px 12px;font-size:12.5px;color:var(--amber);font-weight:600;display:none}
.vd-excess.show{display:block}
.vd-dup{margin:0 16px 14px;border-left:4px solid var(--r-600);background:#fff;padding:9px 12px;font-size:12.5px;color:var(--r-700);font-weight:600;display:none}
.vd-dup.show{display:block}
.rules{list-style:none;border-top:2px solid var(--ink);background:#fff}
.rules li{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.rules li:last-child{border-bottom:none}
.rules .rn{font-family:var(--fm);font-size:10.5px;width:20px;flex:none}
.rules .rt{flex:1}
.rules li.hit{background:var(--r-600);color:#fff;font-weight:600}
.rules li.hit .rn{color:#F6D9D6}
.rules li.hit .rt::after{content:'— aplica';font-family:var(--fm);font-size:10px;margin-left:6px;opacity:.85}

/* ============ IMPORTAR DESDE EXCEL ============ */
.imp-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start}
.pastebox{width:100%;min-height:180px;border:1.5px solid var(--ink);padding:12px;font-family:var(--fm);
  font-size:12.5px;outline:none;resize:vertical;background:#fff;line-height:1.6}
.pastebox:focus{border-color:var(--r-600);box-shadow:3px 3px 0 var(--r-600)}
.orline{display:flex;align-items:center;gap:12px;color:var(--mut);font-family:var(--fm);font-size:11px;letter-spacing:.2em;margin:16px 0}
.orline::before,.orline::after{content:'';flex:1;height:1px;background:var(--line)}
.steps{list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(st,decimal-leading-zero);font-family:var(--fm);font-size:12px;color:var(--r-600);font-weight:600;padding-top:1px;flex:none}
tr.imp-bad td{background:#FBEDEC!important}
tr.imp-bad td:first-child{border-left:4px solid var(--r-600)}
.state-ok{color:#1E6B33;font-weight:600;font-size:12px}
.state-bad{color:var(--r-600);font-weight:600;font-size:12px}
.state-warn{color:var(--amber);font-weight:600;font-size:12px}

/* ============ TABLAS ============ */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  text-align:left;padding:10px 10px;border-top:2px solid var(--ink);border-bottom:1.5px solid var(--ink);white-space:nowrap;background:#fff}
tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:#FBF6F2}
td.mono,.mono{font-family:var(--fm);font-weight:600;font-size:12.5px}
td.r,th.r{text-align:right}
td .sub{display:block;font-family:var(--fm);font-size:10.5px;color:var(--mut);font-weight:400;margin-top:2px}
td .obs{display:block;font-size:12px;color:var(--mut);margin-top:2px;max-width:260px}
tfoot td{padding:11px 10px;border-top:2px solid var(--ink);font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.rowacts{display:flex;gap:6px;justify-content:flex-end}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.searchbox{position:relative;flex:1 1 220px;min-width:200px}
.searchbox i{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut)}
.searchbox .input{padding-left:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  border:1.5px solid var(--ink);padding:6px 11px;background:#fff;display:inline-flex;gap:7px;align-items:center}
.chip .cn{font-family:var(--fm);font-size:10px;color:var(--mut)}
.chip:hover{background:var(--dim)}
.chip.on{background:var(--ink);color:#fff}
.chip.on .cn{color:#D8C8C4}
.sel{border:1.5px solid var(--ink);background:#fff;padding:9px 10px;outline:none}
.sel:focus{border-color:var(--r-600)}

/* Comparativo */
.cmp-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.cmp-arrow{font-family:var(--fd);font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.cmp-arrow .wk{font-family:var(--fm);font-size:14px;border:1.5px solid var(--ink);padding:4px 10px;background:var(--dim)}
.delta{font-family:var(--fm);font-weight:600;font-size:13px;border:1.5px solid;padding:3px 9px}
.delta.up{color:#1E6B33;border-color:#1E6B33}
.delta.down{color:var(--r-600);border-color:var(--r-600)}
.warnline{border:1.5px dashed var(--mut);padding:12px 16px;font-size:13.5px;color:var(--mut);margin-bottom:24px}

/* Reportes subnav */
.subnav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin-bottom:24px}
.subnav button{font-family:var(--fd);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 16px;border:2px solid transparent;border-bottom:none;color:var(--mut);margin-bottom:-2px}
.subnav button:hover{color:var(--ink)}
.subnav button.on{border-color:var(--ink);background:#fff;color:var(--r-600)}
.grp-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
.grp-head:first-child{margin-top:0}
.grp-head h4{font-family:var(--fd);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.grp-head .gl{flex:1;height:1.5px;background:var(--ink)}
.grp-head .gc{font-family:var(--fm);font-size:11.5px;color:var(--mut)}

/* Bitácora */
.logline{display:flex;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.logline:last-child{border-bottom:none}
.logline .lt{font-family:var(--fm);font-size:11px;color:var(--mut);width:120px;flex:none}
.logline .lk{font-family:var(--fd);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink);padding:2px 8px;flex:none}

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" result="n" seed="7"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>

<div id="modal-root"><div class="m-overlay" onclick="closeModal()"></div><div class="m-box" id="m-box"></div></div>
<script>
/* ================================================================
   GRICOL S.A. — Inventario Semanal · aplicación local (localStorage)
   VERSIÓN CON CATÁLOGO DE CANTIDADES ESTÁNDAR Y CONTROL DE EXCEDENTES
   ================================================================ */

// ---------- Utilidades ----------
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function icons(){ if(window.lucide){ try{ lucide.createIcons(); }catch(e){} } }
function b64(s){ try{ return btoa(unescape(encodeURIComponent(String(s)))); }catch(e){ return ''; } }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsRawGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsRawSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsRawDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function sessGet(){ try{ return sessionStorage.getItem('gricol_session'); }catch(e){ return null; } }
function sessSet(){ try{ sessionStorage.setItem('gricol_session','1'); }catch(e){} }
function sessClear(){ try{ sessionStorage.removeItem('gricol_session'); }catch(e){} }

const MS_W = 7*86400000;
function isoWeekOf(ms){
  const d=new Date(ms); const dn=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dn);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return {year:d.getUTCFullYear(), week:Math.ceil(((d-ys)/86400000+1)/7)};
}
const weekKeyOf = ms=>{const{year,week}=isoWeekOf(ms);return `${year}-S${String(week).padStart(2,'0')}`};
const nowWK = ()=>weekKeyOf(Date.now());
const parseWK = k=>{const[y,w]=k.split('-S');return{year:+y,week:+w}};
const dateOfWK = k=>{const{year,week}=parseWK(k);return new Date(Date.UTC(year,0,1+(week-1)*7))};
const prevWK = k=>weekKeyOf(dateOfWK(k).getTime()-MS_W);
const weeksDiff = (a,b)=>Math.round((dateOfWK(b)-dateOfWK(a))/MS_W);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtW = k=>{
  if(!k || k==='all') return 'Todas las semanas';
  const {year,week}=parseWK(k);
  const ene4=new Date(Date.UTC(year,0,4));
  const dn=ene4.getUTCDay()||7;
  const lunesSem1=new Date(Date.UTC(year,0,4-dn+1));
  const lunes=new Date(lunesSem1.getTime()+(week-1)*7*86400000);
  const dia=lunes.getUTCDate();
  const mes=lunes.getUTCMonth();
  const anio=lunes.getUTCFullYear();
  const semMes=Math.min(4,Math.floor((dia-1)/7)+1);
  return `Semana ${semMes} · ${MESES[mes]} ${anio}`;
};
const fmtTs = ts=>{const d=new Date(ts);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

// ---------- Almacenamiento ----------
const DEF_LOCS = ['Bodega Central','Zona de Muestras','Oficina Técnica','Andén 1','Andén 2','Cuarentena','Patio de Cargas'];
  const IMG_BASE = 'https://juandavidsilgado11-ai.github.io/INVENTARIO/imagenes/';
const TIPOS_DEFAULT = ['Producto nuevo','Desarme'];
var _cache = {};

const store = {
  get items(){
    if(_cache.items===undefined) _cache.items = lsGet('gricol_items',[]);
    return _cache.items;
  },
  set items(v){ _cache.items=v; lsSet('gricol_items',v); },
  get log(){
    if(_cache.log===undefined) _cache.log = lsGet('gricol_log',[]);
    return _cache.log;
  },
  set log(v){ _cache.log=v; lsSet('gricol_log',v.slice(0,200)); },
  get locs(){
    if(_cache.locs===undefined) _cache.locs = lsGet('gricol_locs',DEF_LOCS);
    return _cache.locs;
  },
  set locs(v){ _cache.locs=v; lsSet('gricol_locs',v); },
  get cfg(){
    if(_cache.cfg===undefined) _cache.cfg = lsGet('gricol_cfg',{threshold:3});
    return _cache.cfg;
  },
  set cfg(v){ _cache.cfg=v; lsSet('gricol_cfg',v); },
  get auth(){
    if(_cache.auth===undefined) _cache.auth = lsGet('gricol_auth',{user:'admin',hash:b64('gricol2025')});
    return _cache.auth;
  },
  set auth(v){ _cache.auth=v; lsSet('gricol_auth',v); },
  get catalogo(){
    if(_cache.catalogo===undefined) _cache.catalogo = lsGet('gricol_catalogo',{});
    return _cache.catalogo;
  },
  set catalogo(v){ _cache.catalogo=v; lsSet('gricol_catalogo',v); },
  get fijas(){
    if(_cache.fijas===undefined) _cache.fijas = lsGet('gricol_fijas',{});
    return _cache.fijas;
  },
  set fijas(v){ _cache.fijas=v; lsSet('gricol_fijas',v); },
  get lastPrompt(){
    if(_cache.lastPrompt===undefined) _cache.lastPrompt = lsGet('gricol_lastprompt','');
    return _cache.lastPrompt;
  },
  set lastPrompt(v){ _cache.lastPrompt=v; lsSet('gricol_lastprompt',v); },
  get tipos(){
    if(_cache.tipos===undefined) _cache.tipos = lsGet('gricol_tipos',TIPOS_DEFAULT);
    return _cache.tipos;
  },
  set tipos(v){ _cache.tipos=v; lsSet('gricol_tipos',v); },
};
function logEvent(type,msg){ const L=store.log; L.unshift({ts:Date.now(),type,msg}); store.log=L; }

// ---------- Clasificación base (solo por referencia) ----------
function firstSeenWeek(ref){
  let best=null;
  for(const it of store.items) if(it.ref===ref && (best===null || it.week<best)) best=it.week;
  return best;
}
function classifyBase(ref,tipo,wk){
  const r=(ref||'').toUpperCase(), th=store.cfg.threshold;
  if(/^ENS-/.test(r)||r.includes('ENSAYO'))
    return {kind:'assay', label:'Muestra para ensayo', rule:1, reason:'La referencia coincide con la regla 1 (prefijo ENS- / "ENSAYO")'};
  if(/^IMP-/.test(r)||r.includes('IMPORT'))
    return {kind:'import', label:'Muestra de importación', rule:2, reason:'La referencia coincide con la regla 2 (prefijo IMP- / "IMPORT")'};
  if(/^FIJ-/.test(r)||r.includes('FIJO'))
    return {kind:'fixed', label:'Inventario fijo', rule:3, reason:'La referencia coincide con la regla 3 (prefijo FIJ- / "FIJO")'};
  const seen=firstSeenWeek(ref||'');
  const w=seen ? Math.max(0,weeksDiff(seen,wk)) : 0;
  if(seen && w>=th)
    return {kind:'release', label:'Liberar', rule:4, weeks:w, reason:`Sin clasificar · ${w} semana${w===1?'':'s'} en bodega (umbral: ${th}) → se sugiere liberar`};
  return {kind:'move', label:'Trasladar', rule:4, weeks:w,
          reason: seen ? `Sin clasificar · ${w} semana${w===1?'':'s'} en bodega → trasladar a zona definida` : 'Referencia nueva sin coincidencia con las reglas 1–3 → revisar y trasladar'};
}

// ---------- Clasificación con control de excedente ----------
// Devuelve: { kind, label, reason, rule, excedente, faltante, cantidadBase, catalogoOK, esExcedente }
function classify(ref,tipo,wk,cantidad){
  var refU=(ref||'').toUpperCase();
  if(store.fijas[ref] || store.fijas[refU]){
    var catF=store.catalogo[ref] || store.catalogo[refU];
    var baseQtyF2=catF!=null?Number(catF):null;
    var qF2=Number(cantidad);
    if(baseQtyF2==null || cantidad==null || isNaN(qF2)){
      return {kind:'fixed', label:'Inventario fijo', rule:0, reason:'Registrada como referencia fija · se repite cada semana',
              cantidadBase:baseQtyF2, excedente:null, faltante:null, catalogoOK:baseQtyF2!=null, esExcedente:false};
    }
    if(qF2>baseQtyF2){
      return {kind:'fixed', label:'Inventario fijo', rule:0,
              reason:`Inventario fijo · cantidad estándar: ${baseQtyF2} und. Excedente: ${qF2-baseQtyF2} und → liberar solo el excedente.`,
              cantidadBase:baseQtyF2, excedente:qF2-baseQtyF2, faltante:0, catalogoOK:true, esExcedente:false};
    }
    if(qF2<baseQtyF2){
      return {kind:'fixed', label:'Inventario fijo', rule:0,
              reason:`Inventario fijo · cantidad estándar: ${baseQtyF2} und. Faltan ${baseQtyF2-qF2} und.`,
              cantidadBase:baseQtyF2, excedente:0, faltante:baseQtyF2-qF2, catalogoOK:true, esExcedente:false};
    }
    return {kind:'fixed', label:'Inventario fijo', rule:0, reason:'Registrada como referencia fija · se repite cada semana',
            cantidadBase:baseQtyF2, excedente:0, faltante:0, catalogoOK:true, esExcedente:false};
  }
  var base=classifyBase(ref,tipo,wk);
  const r=(ref||'').toUpperCase();
  const cat=store.catalogo;
  const esMuestra = base.kind==='import' || base.kind==='assay';
  const esFija   = base.kind==='fixed';

  // Si es un ítem de excedente ya creado aparte, no volver a calcular
  if(/-EXC$/.test(r)){
    return {...base, excedente:null, faltante:null, cantidadBase:null, catalogoOK:true, esExcedente:true,
      label:'Liberar (excedente)', kind:'release', reason:'Excedente de una muestra de importación o ensayo → liberar del inventario base'};
  }

  // Fijas: solo validar que existan en catálogo
  if(esFija){
    if(cat[ref]==null){
      return {...base, cantidadBase:null, excedente:null, faltante:null, catalogoOK:false,
        reason: base.reason + ' · Esta referencia no está en el catálogo de cantidades estándar.'};
    }
    var baseQtyF=Number(cat[ref]);
    var qF=Number(cantidad);
    if(cantidad==null || isNaN(qF)) return {...base, cantidadBase:baseQtyF, excedente:null, faltante:null, catalogoOK:true};
    if(qF>baseQtyF){
      return {...base, cantidadBase:baseQtyF, excedente:qF-baseQtyF, faltante:0, catalogoOK:true,
        reason:`Inventario fijo · cantidad estándar: ${baseQtyF} und. Excedente: ${qF-baseQtyF} und → liberar solo el excedente.`};
    }
    if(qF<baseQtyF){
      return {...base, cantidadBase:baseQtyF, excedente:0, faltante:baseQtyF-qF, catalogoOK:true,
        reason:`Inventario fijo · cantidad estándar: ${baseQtyF} und. Faltan ${baseQtyF-qF} und.`};
    }
    return {...base, cantidadBase:baseQtyF, excedente:0, faltante:0, catalogoOK:true,
      reason:`Inventario fijo · cantidad estándar: ${baseQtyF} und · OK.`};
  }
  // Muestras (import / assay): validar contra catálogo
  if(esMuestra){
    if(cat[ref]==null){
      return {...base, cantidadBase:null, excedente:null, faltante:null, catalogoOK:false,
        reason: base.reason + ' · Esta referencia no está en el catálogo de cantidades estándar.'};
    }
    const baseQty=Number(cat[ref]);
    const q=Number(cantidad);
    if(cantidad==null || isNaN(q)) return {...base, cantidadBase:baseQty, excedente:null, faltante:null, catalogoOK:true};
    if(q>baseQty){
      return {...base, cantidadBase:baseQty, excedente:q-baseQty, faltante:0, catalogoOK:true,
        reason:`${base.label} · cantidad estándar: ${baseQty} und. Excedente: ${q-baseQty} und → liberar solo el excedente.`};
    }
    if(q<baseQty){
      return {...base, cantidadBase:baseQty, excedente:0, faltante:baseQty-q, catalogoOK:true,
        reason:`${base.label} · cantidad estándar: ${baseQty} und. Faltan ${baseQty-q} und (posiblemente se sacaron del inventario base).`};
    }
    return {...base, cantidadBase:baseQty, excedente:0, faltante:0, catalogoOK:true,
      reason:`${base.label} · cantidad estándar: ${baseQty} und · OK.`};
  }

  // Regla 4 normal
  return {...base, cantidadBase:null, excedente:null, faltante:null, catalogoOK:true};
}

const RULES_TXT=[
  'La referencia inicia con "ENS-" o contiene "ENSAYO" → Muestra para ensayo',
  'La referencia inicia con "IMP-" o contiene "IMPORT" → Muestra de importación',
  'La referencia inicia con "FIJ-" o contiene "FIJO" → Inventario fijo',
  'Sin coincidencia → por antigüedad: liberar si supera el umbral de semanas, trasladar si no',
];

// ---------- Datos de ejemplo (primera visita) ----------

    mk('ENS-0088','Válvula de compuerta p/ ensayo hidráulico',4,'Muestra','Oficina Técnica',W1,'',6e6),
    mk('ENS-0088','Válvula de compuerta p/ ensayo hidráulico',3,'Muestra','Oficina Técnica',W0,'Una unidad devuelta al proveedor',4e6),
    mk('REF-1180','Lámina antiderrapante 1.2×2.4 m',60,'Materia prima','Andén 1',W1,'',5e6),
    mk('REF-1180','Lámina antiderrapante 1.2×2.4 m',75,'Materia prima','Andén 1',W0,'Ingreso parcial del miércoles',2.4e6),
    mk('REF-7702','Kit de empaques vitón 2"',30,'Repuesto','Cuarentena',W3,'Pendiente definir destino',11e6),
    mk('REF-7702','Kit de empaques vitón 2"',30,'Repuesto','Cuarentena',W2,'Pendiente definir destino',10e6),
    mk('REF-7702','Kit de empaques vitón 2"',30,'Repuesto','Cuarentena',W1,'Pendiente definir destino',9.5e6),
    mk('REF-7702','Kit de empaques vitón 2"',30,'Repuesto','Cuarentena',W0,'Pendiente definir destino',2.2e6),
    mk('REF-5540','Cinta reflectriz alta visibilidad',110,'Empaque','Patio de Cargas',W1,'',5.4e6),
    mk('REF-5540','Cinta reflectriz alta visibilidad',110,'Empaque','Patio de Cargas',W0,'',2.1e6),
    mk('REF-3301','Tornillería inox M12 (sobrante)',180,'Empaque','Patio de Cargas',W1,'Se despachó el viernes',4e6),
    mk('REF-2210','Serie de bufandas NR 2" pulida',52,'Producto terminado','Cuarentena',W1,'Rechazada por calidad',3.6e6),
    mk('IMP-0512','Sensor inductivo M12 (muestras catálogo)',24,'Muestra','Zona de Muestras',W0,'Contenedor IMP-121',1.5e6),
    mk('ENS-0100','Manguera hidráulica p/ banco de ensayos',12,'Muestra','Oficina Técnica',W0,'Ensayo de presión programado',1.2e6),
    mk('REF-4420','Bandeja plástica 600×400',96,'Empaque','Andén 2',W0,'Sin clasificar — tratar en reunión del lunes',1.1e6),
  ];
  // Catálogo de ejemplo

const itemsOfWeek = wk=>store.items.filter(i=>i.week===wk);
function aggByRef(wk){
  const m=new Map();
  for(const it of itemsOfWeek(wk)){
    if(!m.has(it.ref)) m.set(it.ref,{ref:it.ref,desc:it.desc,qty:0,loc:it.loc,tipo:it.tipo,obs:it.obs,weeks:[it.week],item:it});
    const e=m.get(it.ref); e.qty+=Number(it.qty)||0; e.weeks.push(it.week);
  }
  return m;
}
function compareWeeks(wk){
  const prev=prevWK(wk), A=aggByRef(prev), B=aggByRef(wk);
  const out=[],inn=[],chg=[];
  for(const [ref,e] of A) if(!B.has(ref)) out.push(e);
  for(const [ref,e] of B) if(!A.has(ref)) inn.push(e);
  for(const [ref,e] of B) if(A.has(ref)){const a=A.get(ref);
    if(a.qty!==e.qty || a.loc!==e.loc) chg.push({ref,from:a,to:e});}
  const q=m=>[...m.values()].reduce((s,e)=>s+e.qty,0);
  return {prev, out, inn, chg, qA:q(A), qB:q(B), hasPrev:A.size>0};
}
const outSorted = o=>[...o].sort((a,b)=>a.ref.localeCompare(b.ref));

function dlCSV(name,rows){

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

// ---------- Repetición automática de fijas ----------
function repetirFijas(wk){
  const fijas=store.fijas;
  const yaExisten=new Set(itemsOfWeek(wk).map(i=>i.ref));
  let added=0;
  const nuevos=[];
  for(const [ref,meta] of Object.entries(fijas)){
    if(yaExisten.has(ref)) continue;
    const qty=Number(store.catalogo[ref] ?? 0);
    if(!qty) continue;
    nuevos.push({id:uid(),ref,desc:meta.desc||'—',qty,tipo:meta.tipo||'Otro',loc:meta.loc||(store.locs[0]||''),week:wk,obs:'Repetido automáticamente (inventario fijo)',ts:Date.now(),auto:true});
    added++;
  }
  if(nuevos.length){ store.items=[...store.items,...nuevos]; logEvent('ingreso',`Repetición automática de ${added} referencia(s) fija(s) en ${wk}`); }
  return added;
}

// ---------- Prompt semanal de "mantener referencias" ----------
function checkWeeklyPrompt(){
  const wk=nowWK();
  const last=store.lastPrompt;
  if(last===wk) return;               // ya se preguntó esta semana
  const prev=prevWK(wk);
  const prevItems=itemsOfWeek(prev).filter(i=>{
    const r=i.ref.toUpperCase();
    return /^IMP-/.test(r)||/^ENS-/.test(r)||r.includes('IMPORT')||r.includes('ENSAYO');
  });
  // Si no hay nada que preguntar, marcar la semana y salir
  if(!prevItems.length){ store.lastPrompt=wk; return; }
  openKeepModal(wk,prevItems);
}
function openKeepModal(wk,prevItems){
  const agg=new Map();
  for(const it of prevItems){
    if(!agg.has(it.ref)) agg.set(it.ref,{ref:it.ref,desc:it.desc,qty:0,tipo:it.tipo,loc:it.loc});
    agg.get(it.ref).qty+=Number(it.qty)||0;
  }
  const rows=[...agg.values()];
  const html=`<div class="m-head"><i data-lucide="calendar-check"></i><h3>Inicio de ${fmtW(wk)}</h3>
    <button class="btn icon" onclick="skipKeepModal()"><i data-lucide="x"></i></button></div>
    <div class="m-body">
      <p style="margin-bottom:14px;font-size:13.5px">Estas referencias de <b>importación</b> y <b>ensayo</b> estaban la semana pasada. Marca las que <b>continúan</b> en esta semana. Las que desmarques se considerarán <b>salida efectiva del inventario</b>.</p>
      <div class="keep-list" id="keep-list">
        ${rows.map(r=>`<label class="keep-row">
          <input type="checkbox" data-ref="${esc(r.ref)}" checked>
          <span class="kr">${esc(r.ref)}</span>
          <span class="kd">${esc(r.desc)}</span>
          <span class="kq num">${r.qty} und</span>
          <span class="kl">${/^IMP-|IMPORT/i.test(r.ref)?'Import':'Ensayo'}</span>
        </label>`).join('')}
      </div>
      <p style="margin-top:12px;font-size:12px;color:var(--mut)">Las referencias <b>fijas</b> se repiten solas, no necesitas marcarlas aquí.</p>
    </div>
    <div class="m-foot">
      <button class="btn" onclick="skipKeepModal()">Saltar por ahora</button>
      <button class="btn primary" id="keep-ok"><i data-lucide="check"></i> Confirmar selección</button>
    </div>`;
  openModal(html);
  $('#keep-ok').onclick=()=>{
    const checks=$$('#keep-list input[type=checkbox]');
    const mantener=new Set();
    checks.forEach(c=>{ if(c.checked) mantener.add(c.dataset.ref); });
    // Copiar las marcadas a la semana actual
    let copiadas=0, eliminadas=0;
    const nuevas=[];
    const yaEnWk=new Set(itemsOfWeek(wk).map(i=>i.ref));
    for(const it of prevItems){
      if(mantener.has(it.ref) && !yaEnWk.has(it.ref)){
        nuevas.push({...it,id:uid(),week:wk,ts:Date.now(),obs:(it.obs?it.obs+' · ':'')+'Mantenida de '+prevWK(wk)});
        yaEnWk.add(it.ref);
        copiadas++;
      } else if(!mantener.has(it.ref)){
        eliminadas++;
      }
    }
    if(nuevas.length) store.items=[...store.items,...nuevas];
    store.lastPrompt=wk;
    logEvent('ingreso',`Inicio ${wk}: ${copiadas} muestra(s) mantenida(s), ${eliminadas} marcada(s) como salida`);
    closeModal();
    toast(`${fmtW(wk)} iniciada. ${copiadas} muestra(s) mantenida(s).`,'ok','calendar-check');
    renderView();
  };
}
function skipKeepModal(){
  store.lastPrompt=nowWK();
  closeModal();
}

  icons(); bindModeBar();
  const refresh=()=>updateVerdict(false);
  ['i-ref','i-desc','i-qty','i-obs'].forEach(id=>$('#'+id).addEventListener('input',()=>{
    state.enter[id.slice(2)]=$('#'+id).value; refresh();}));
  ['i-tipo','i-loc','i-week'].forEach(id=>$('#'+id).addEventListener('change',()=>{
    state.enter[id.slice(2)]=$('#'+id).value; refresh();}));

  $('#f-item').onsubmit=ev=>{
    ev.preventDefault();
    const ref=state.enter.ref.trim().toUpperCase();
    const qty=Number(state.enter.qty);
    let ok=true;
    $('#e-ref').classList.toggle('show',!ref); if(!ref)ok=false;
    $('#e-qty').classList.toggle('show',state.enter.qty===''||isNaN(qty)||qty<0); if(isNaN(qty)||qty<0||state.enter.qty==='')ok=false;
    if(!ok) return;
    const wk=state.enter.week;
    const c=classify(ref,state.enter.tipo,wk,qty);
    // Detectar excedente ANTES de guardar
    let excedenteCreado=0;
    let qtyBase=qty;
    if(c.excedente>0){
      qtyBase=c.cantidadBase;
      excedenteCreado=c.excedente;
    }
    const dup=store.items.find(i=>i.week===wk && i.ref===ref);
    if(dup){
      dup.qty+=qtyBase;
      if(state.enter.desc) dup.desc=state.enter.desc;
      if(state.enter.obs) dup.obs=dup.obs?dup.obs+' · '+state.enter.obs:state.enter.obs;
      dup.ts=Date.now(); dup.loc=state.enter.loc; dup.tipo=state.enter.tipo;
      store.items=[...store.items];
      logEvent('ingreso',`${ref} · suma de ${qtyBase} und (total ${dup.qty}) en ${state.enter.loc} — ${wk}`);
      toast(`La referencia ya existía en ${wk}: se sumaron ${qtyBase} und (total ${dup.qty}).`,'warn','git-merge');
    } else {
      store.items=[...store.items,{id:uid(),ref,desc:state.enter.desc.trim()||'—',qty:qtyBase,
        tipo:state.enter.tipo,loc:state.enter.loc,week:wk,obs:state.enter.obs.trim(),ts:Date.now()}];
      logEvent('ingreso',`${ref} · ${state.enter.desc.trim()||'sin descripción'} — ${qtyBase} und en ${state.enter.loc} — ${wk}`);
      toast(`Ítem registrado en ${wk}. Clasificado: ${c.label}.`,'ok','stamp');
    }
    // Crear ítem de excedente
    if(excedenteCreado>0){
      const refExc=ref+'-EXC';
      const yaExc=store.items.find(i=>i.week===wk && i.ref===refExc);
      if(yaExc){ yaExc.qty+=excedenteCreado; yaExc.ts=Date.now(); }
      else {
        store.items=[...store.items,{id:uid(),ref:refExc,desc:(state.enter.desc||c.label)+' (excedente)',qty:excedenteCreado,
          tipo:state.enter.tipo,loc:state.enter.loc,week:wk,obs:`Excedente de ${ref} · cantidad base ${c.cantidadBase} und`,ts:Date.now()}];
      }
      logEvent('excedente',`${ref} · ${excedenteCreado} und excedentes creados como ${refExc} → LIBERAR`);
      toast(`Excedente detectado: ${excedenteCreado} und marcados como LIBERAR.`,'warn','alert-triangle');
    }
    Object.assign(state.enter,{ref:'',desc:'',qty:'',obs:''});
    vManual();
  };
  updateVerdict(true);
}
let lastStamp='';
function updateVerdict(first){
  const e=state.enter, stage=$('#vd-stage'); if(!stage) return;
  const wk=e.week;
  const qty=Number(e.qty);
  const dup=e.ref.trim()? store.items.find(i=>i.week===wk && i.ref===e.ref.trim().toUpperCase()):null;
  const dd=$('#vd-dup');
  if(dup){dd.classList.add('show');
    dd.innerHTML=`Ya registrada en ${wk}: <b>${dup.qty} und</b> · ${esc(dup.loc)}. Al guardar se sumará la cantidad.`;
  } else dd.classList.remove('show');

  const ex=$('#vd-excess');
  if(ex){
    if(e.ref.trim() && !isNaN(qty) && qty>0){
      const c=classify(e.ref.trim(),e.tipo,wk,qty);
      if(c.excedente>0){
        ex.classList.add('show');
        ex.innerHTML=`⚠️ Excedente: <b>${c.excedente} und</b> sobre la cantidad base (${c.cantidadBase}). Se crearán como <b>${e.ref.trim().toUpperCase()}-EXC</b> → LIBERAR.`;
      } else if(c.faltante>0){
        ex.classList.add('show');
        ex.innerHTML=`ℹ️ Faltan <b>${c.faltante} und</b> respecto a la cantidad base (${c.cantidadBase}).`;
      } else {
        ex.classList.remove('show');
      }
    } else ex.classList.remove('show');
  }

  if(!e.ref.trim() && !first){
    stage.innerHTML=`<div class="vd-idle">Escribe la referencia del ítem.<br>El sistema la clasificará al instante.</div>`;
  } else if(!e.ref.trim()){
    stage.innerHTML=`<div class="vd-idle">En espera de la referencia…</div>`;
  } else {
    const c=classify(e.ref.trim(),e.tipo,wk,isNaN(qty)?null:qty);
    let cls=c.kind;
    if(c.esExcedente||c.excedente>0) cls='excess';
    stage.innerHTML=`<span class="stamp big c-${cls}" id="vd-stamp">${c.label}</span>
      <div class="vd-reason">${esc(c.reason)}</div>`;
    if(lastStamp!==c.label){const s=$('#vd-stamp');s.classList.add('animate');
      setTimeout(()=>s.classList.remove('animate'),350);}
    lastStamp=c.label;
  }
  const c2=e.ref.trim()? classify(e.ref.trim(),e.tipo,wk,isNaN(qty)?null:qty):null;
  $('#vd-rules').innerHTML=RULES_TXT.map((t,i)=>{
    const hit=c2 && c2.rule===i+1;
    const txt=i===3? t.replace('el umbral',`el umbral (${store.cfg.threshold} sem.)`) : t;
    return `<li class="${hit?'hit':''}"><span class="rn">R${i+1}</span><span class="rt">${esc(txt)}</span></li>`;
  }).join('');
}

// ---------- 02B · Importación masiva ----------
function parseImpText(text){
  const clean=String(text||'').replace(/^\ufeff/,'').replace(/\r\n?/g,'\n');
  const lines=clean.split('\n').map(l=>l.trim()).filter(l=>l!=='');
  if(!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
  let cells=lines.map(l=>l.split(delim).map(c=>c.trim()));
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const H={
    ref:['referencia','referencias','ref','codigo','cod'],
    desc:['descripcion','desc','articulo','nombre','producto','detalle'],
    qty:['cantidad','cantidades','cant','qty','unidades','und','existencia','existencias'],
    tipo:['tipo','clase','categoria'],
    loc:['ubicacion','zona','bodega','loc','ubicacionactual'],
    week:['semana','semanas','week'],
    obs:['observaciones','observacion','notas','nota','comentarios','comentario']
  };
  let map={ref:0,desc:1,qty:2,tipo:3,loc:4,week:5,obs:6}, hasHead=false;
  const head=cells[0].map(norm);
  if(head.some(h=>H.ref.includes(h)||H.qty.includes(h)||H.desc.includes(h))){
    hasHead=true; map={};
    head.forEach((h,i)=>{for(const k in H) if(H[k].includes(h)){map[k]=i;break;}});
    cells=cells.slice(1);
  }
  const imp=state.enter.imp;
  return cells.map((c,i)=>{
    const g=k=>map[k]!=null?(c[map[k]]||''):'';
    const line=i+(hasHead?2:1);
    const ref=(g('ref')||'').toUpperCase();
    const desc=g('desc'), tipo=g('tipo'), loc=g('loc'), obs=g('obs');
    const qtyRaw=g('qty'), weekRaw=g('week');
    const qty=parseInt(String(qtyRaw).replace(/[^\d-]/g,''),10);
    let week=imp.week, error='';
    if(!ref) error='Falta la referencia.';
    if(!error && (qtyRaw===''||isNaN(qty)||qty<0))
      error=qtyRaw===''?'Falta la cantidad.':`Cantidad no válida: "${qtyRaw}".`;
    if(!error && weekRaw){
      const w=String(weekRaw).toUpperCase().replace(/\s/g,'');
      let m=w.match(/^(\d{4})-?S(\d{1,2})$/);
      if(m) week=m[1]+'-S'+String(+m[2]).padStart(2,'0');
      else{
        m=w.match(/^S?(\d{1,2})$/);
        if(m) week=String(new Date().getFullYear())+'-S'+String(+m[1]).padStart(2,'0');
        else error=`Semana no reconocida: "${weekRaw}" (usa 2026-S07, S07 o 7).`;
      }
    }
    return {line,ref,desc,tipo:tipo||'Otro',loc,obs,qtyRaw,qty:(!isNaN(qty)&&qty>=0)?qty:null,week,error,
      exists:ref? !!store.items.find(x=>x.week===week && x.ref===ref):false};
  });
}
