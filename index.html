<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRICOL S.A. — Inventario Semanal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B01E23'/%3E%3Ctext x='16' y='23' font-family='Arial Black' font-size='19' font-weight='900' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script>
(function(){
  if(window.lucide) return;
  var s=document.createElement('script');
  s.src='https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js';
  s.onload=function(){ try{ if(typeof icons==='function') icons(); }catch(e){} };
  document.head.appendChild(s);
})();
</script>
<style>
:root{
  --r-950:#43060A; --r-900:#5F0A0F; --r-800:#7C0F14; --r-700:#9A141A;
  --r-600:#B01E23; --r-500:#C8231F;
  --ink:#1D1414; --paper:#FFFFFF; --dim:#F7F0EB; --line:#E7DCD6; --mut:#8A7773;
  --fd:'Oswald',sans-serif; --fu:'Archivo',sans-serif; --fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fu);background:var(--r-800);color:var(--ink);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
i[data-lucide]{display:inline-block}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--r-600);color:#fff}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:600;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:11px 18px;
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;user-select:none}
.btn:hover{background:var(--dim)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--r-600);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--r-500)}
.btn.red{background:var(--r-600);color:#fff}
.btn.small{padding:7px 12px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
.btn.small:active{transform:translate(2px,2px)}
.btn.icon{padding:8px;border:1.5px solid var(--ink);box-shadow:none;background:#fff}
.btn.icon:hover{background:var(--dim)}
.btn.icon.danger:hover{background:var(--r-600);color:#fff;border-color:var(--r-600)}
.btn:disabled{opacity:.4;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.field label b{color:var(--r-600)}
.input{border:1.5px solid var(--ink);background:#fff;padding:10px 12px;outline:none;width:100%;border-radius:0}
.input:focus{border-color:var(--r-600);box-shadow:3px 3px 0 var(--r-600)}
textarea.input{resize:vertical;min-height:64px}
.ferr{font-size:12px;color:var(--r-600);font-weight:600;display:none}
.ferr.show{display:block}

.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.lg-brand{background:var(--r-800);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-brand::after{content:'G';position:absolute;right:-70px;bottom:-120px;font-family:var(--fd);font-weight:700;font-size:560px;line-height:1;color:var(--r-900);pointer-events:none}
.lg-kicker{font-family:var(--fm);font-size:12px;letter-spacing:.28em;border-bottom:2px solid #fff;padding-bottom:14px;display:inline-block}
.lg-word{font-family:var(--fd);font-weight:700;font-size:clamp(64px,9vw,124px);line-height:.92;letter-spacing:.01em;margin-top:26px;position:relative;z-index:1}
.lg-word small{display:block;font-size:.32em;font-weight:500;letter-spacing:.5em;color:#fff;opacity:.85;margin-top:10px}
.lg-sub{max-width:420px;margin-top:28px;font-size:15px;color:#F3DEDC;position:relative;z-index:1}
.lg-foot{font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:#E8C7C4;position:relative;z-index:1}
.lg-panel{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:40px;border-left:6px solid var(--r-600)}
.lg-card{width:100%;max-width:360px}
.lg-card h2{font-family:var(--fd);font-size:26px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lg-card .rule{height:3px;background:var(--ink);margin:14px 0 26px}
.lg-hint{margin-top:22px;border:1.5px dashed var(--mut);padding:10px 12px;font-family:var(--fm);font-size:12px;color:var(--mut)}
.lg-hint b{color:var(--ink)}
.lg-err{display:none;margin-top:14px;border-left:4px solid var(--r-600);background:#FBEDEC;padding:9px 12px;font-size:13px;font-weight:600;color:var(--r-700)}
.lg-err.show{display:block}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:42px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px;color:var(--mut)}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--r-950);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:4px solid var(--r-600)}
.sb-logo{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:12px}
.sb-mark{width:38px;height:38px;background:#fff;color:var(--r-600);font-family:var(--fd);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.sb-logo .t1{font-family:var(--fd);font-weight:600;font-size:17px;letter-spacing:.06em;line-height:1.1}
.sb-logo .t2{font-family:var(--fm);font-size:10px;letter-spacing:.24em;color:#E8C7C4}
.sb-nav{flex:1;padding:14px 0;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 20px;color:#F0DCDA;font-family:var(--fd);font-weight:500;font-size:14px;letter-spacing:.09em;text-transform:uppercase;border-left:4px solid transparent}
.nav-btn .n{font-family:var(--fm);font-size:10px;color:#C98F8B;width:18px}
.nav-btn:hover{background:var(--r-900)}
.nav-btn.active{background:#fff;color:var(--r-700);border-left-color:var(--r-600)}
.nav-btn.active .n{color:var(--r-600)}
.nav-btn i{width:17px;height:17px}
.sb-user{border-top:1px solid rgba(255,255,255,.14);padding:16px 20px;display:flex;align-items:center;gap:10px}
.sb-user .av{width:32px;height:32px;background:var(--r-600);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;flex:none}
.sb-user .un{font-family:var(--fm);font-size:12px;letter-spacing:.06em}
.sb-user .rl{font-size:10px;color:#C98F8B;letter-spacing:.14em;text-transform:uppercase}
.sb-exit{margin-left:auto;color:#E8C7C4;padding:6px}
.sb-exit:hover{color:#fff}
.main{background:var(--paper);min-width:0}
.wrap{max-width:1160px;margin:0 auto;padding:38px 44px 80px}

.storwarn{background:#FBEDEC;border:2px solid var(--r-600);color:var(--r-700);padding:14px 16px;font-size:13.5px;margin-bottom:26px;display:flex;gap:12px;align-items:flex-start}
.storwarn i{width:20px;height:20px;flex:none;margin-top:1px}

.sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.sec-num{font-family:var(--fm);font-size:13px;color:var(--r-600);font-weight:600}
.sec-head h1{font-family:var(--fd);font-weight:600;font-size:clamp(24px,3vw,34px);letter-spacing:.03em;text-transform:uppercase;line-height:1}
.sec-rule{flex:1;height:3px;background:var(--ink);min-width:60px}
.sec-meta{font-family:var(--fm);font-size:12px;letter-spacing:.1em;color:var(--mut)}

.modebar{display:flex;border:2px solid var(--ink);width:max-content;max-width:100%;margin-bottom:26px;background:#fff;overflow-x:auto}
.modebar button{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 22px;display:inline-flex;gap:8px;align-items:center;color:var(--mut);white-space:nowrap}
.modebar button.on{background:var(--ink);color:#fff}
.modebar button i{width:15px;height:15px}

.stamp{display:inline-block;font-family:var(--fd);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:3px solid currentColor;padding:.3em .65em;transform:rotate(-3.5deg);filter:url(#rough);background:transparent}
.stamp.big{font-size:clamp(20px,2.4vw,27px)}
.stamp.sm{font-size:11px;border-width:2px;padding:.2em .5em;transform:rotate(-2deg)}
@keyframes stampIn{0%{transform:rotate(-3.5deg) scale(1.7);opacity:0}55%{transform:rotate(-3.5deg) scale(.94);opacity:1}100%{transform:rotate(-3.5deg) scale(1)}}
.stamp.animate{animation:stampIn .28s cubic-bezier(.2,1.4,.4,1)}
.c-fixed{color:var(--ink)} .c-import{color:var(--r-600)} .c-assay{color:var(--r-700)}
.c-move{color:#6B5A56} .c-release{color:var(--r-500)}

.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--fd);font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border:1.5px solid currentColor;white-space:nowrap}
.tag .stripes{width:15px;height:9px;border:1px solid currentColor;background:repeating-linear-gradient(45deg,currentColor 0 2.5px,transparent 2.5px 5.5px)}
.t-fixed{color:var(--ink)} .t-import{background:var(--r-600);border-color:var(--r-600);color:#fff}
.t-assay{color:var(--r-700)} .t-move{color:#5C4C48;background:var(--dim)}
.t-release{color:var(--r-500)} .t-out{color:var(--r-600);border-style:dashed}

.band{display:flex;flex-wrap:wrap;border:2px solid var(--ink);margin-bottom:34px;background:#fff}
.kpi{padding:20px 26px;flex:1 1 150px;border-right:1.5px solid var(--line);min-width:140px}
.kpi:last-child{border-right:none}
.kpi .v{font-family:var(--fd);font-weight:700;font-size:42px;line-height:1}
.kpi .v.alert{color:var(--r-600)}
.kpi .l{font-family:var(--fd);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.kpi.hero{flex:2 1 220px;background:var(--r-600);color:#fff;border-right:1.5px solid var(--ink)}
.kpi.hero .l{color:#F6D9D6}
.kpi.hero .v{font-size:56px}
.kpi.hero small{font-family:var(--fm);font-size:12px;letter-spacing:.1em}

.panel{border:2px solid var(--ink);background:#fff;margin-bottom:30px}
.panel-head{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.panel-head .idx{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--r-600)}
.panel-head h3{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.panel-head .spacer{flex:1}
.panel-body{padding:18px}
.empty{padding:34px;text-align:center;color:var(--mut)}
.empty i{width:34px;height:34px;margin-bottom:10px;color:var(--mut)}
.empty p{font-size:14px}

.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:26px;align-items:start}

.alist{list-style:none}
.alist li{display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:none}
.alist .ix{font-family:var(--fm);font-size:12px;color:var(--r-600);font-weight:600;padding-top:3px;width:22px;flex:none}
.alist .body{flex:1;min-width:0}
.alist .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alist .ref{font-family:var(--fm);font-weight:600;font-size:13px}
.alist .why{font-size:12.5px;color:var(--mut);margin-top:3px}
.linkish{font-family:var(--fm);font-size:11.5px;color:var(--r-600);text-decoration:underline;text-underline-offset:3px}

.hbar{display:grid;grid-template-columns:150px 1fr 34px;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.hbar .bl{font-family:var(--fd);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;border:1px solid var(--ink);background:#fff;position:relative}
.hbar .fill{position:absolute;inset:1px auto 1px 1px;background:var(--ink)}
.hbar .fill.f-import{background:var(--r-600)}
.hbar .fill.f-assay{background:var(--r-700)}
.hbar .fill.f-move{background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 7px)}
.hbar .fill.f-release{background:repeating-linear-gradient(45deg,var(--r-500) 0 3px,transparent 3px 7px)}
.hbar .bn{font-family:var(--fm);font-size:12px;text-align:right;font-weight:600}

.fgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:start}
.fcard{border:2px solid var(--ink);background:#fff;padding:26px}
.frows{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.frows .full{grid-column:1/-1}
.verdict{border:2px solid var(--ink);background:var(--dim);position:sticky;top:24px}
.vd-head{border-bottom:2px solid var(--ink);padding:11px 16px;font-family:var(--fd);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;background:#fff}
.vd-stage{padding:30px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:150px;justify-content:center}
.vd-idle{font-family:var(--fm);font-size:12.5px;color:var(--mut);text-align:center}
.vd-reason{font-size:12.5px;color:var(--mut);text-align:center;max-width:280px}
.vd-dup{margin:0 16px 14px;border-left:4px solid var(--r-600);background:#fff;padding:9px 12px;font-size:12.5px;color:var(--r-700);font-weight:600;display:none}
.vd-dup.show{display:block}
.rules{list-style:none;border-top:2px solid var(--ink);background:#fff}
.rules li{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.rules li:last-child{border-bottom:none}
.rules .rn{font-family:var(--fm);font-size:10.5px;width:20px;flex:none}
.rules .rt{flex:1}
.rules li.hit{background:var(--r-600);color:#fff;font-weight:600}
.rules li.hit .rn{color:#F6D9D6}
.rules li.hit .rt::after{content:'— aplica';font-family:var(--fm);font-size:10px;margin-left:6px;opacity:.85}

/* Importación */
.pastebox{width:100%;min-height:180px;border:1.5px solid var(--ink);padding:12px;font-family:var(--fm);
  font-size:12.5px;outline:none;resize:vertical;background:#fff;line-height:1.6}
.pastebox:focus{border-color:var(--r-600);box-shadow:3px 3px 0 var(--r-600)}
.orline{display:flex;align-items:center;gap:12px;color:var(--mut);font-family:var(--fm);font-size:11px;letter-spacing:.2em;margin:16px 0}
.orline::before,.orline::after{content:'';flex:1;height:1px;background:var(--line)}
.colmap{display:flex;flex-wrap:wrap;gap:16px}
.colmap-item{display:flex;flex-direction:column;gap:4px;min-width:160px}
.cm-l{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--r-600);font-weight:600}
.cm-s{font-family:var(--fm);font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.mapnote{font-size:12.5px;color:var(--mut);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
tr.imp-bad td{background:#FBEDEC!important}
tr.imp-bad td:first-child{border-left:4px solid var(--r-600)}
.state-ok{color:#1E6B33;font-weight:600;font-size:12px}
.state-bad{color:var(--r-600);font-weight:600;font-size:12px}

.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  text-align:left;padding:10px 10px;border-top:2px solid var(--ink);border-bottom:1.5px solid var(--ink);white-space:nowrap;background:#fff}
tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:#FBF6F2}
td.mono,.mono{font-family:var(--fm);font-weight:600;font-size:12.5px}
td.r,th.r{text-align:right}
td .sub{display:block;font-family:var(--fm);font-size:10.5px;color:var(--mut);font-weight:400;margin-top:2px}
td .obs{display:block;font-size:12px;color:var(--mut);margin-top:2px;max-width:260px}
tfoot td{padding:11px 10px;border-top:2px solid var(--ink);font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.rowacts{display:flex;gap:6px;justify-content:flex-end}

.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.searchbox{position:relative;flex:1 1 220px;min-width:200px}
.searchbox i{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mut)}
.searchbox .input{padding-left:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  border:1.5px solid var(--ink);padding:6px 11px;background:#fff;display:inline-flex;gap:7px;align-items:center}
.chip .cn{font-family:var(--fm);font-size:10px;color:var(--mut)}
.chip:hover{background:var(--dim)}
.chip.on{background:var(--ink);color:#fff}
.chip.on .cn{color:#D8C8C4}
.sel{border:1.5px solid var(--ink);background:#fff;padding:9px 10px;outline:none}
.sel:focus{border-color:var(--r-600)}

.cmp-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.cmp-arrow{font-family:var(--fd);font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.cmp-arrow .wk{font-family:var(--fm);font-size:14px;border:1.5px solid var(--ink);padding:4px 10px;background:var(--dim)}
.delta{font-family:var(--fm);font-weight:600;font-size:13px;border:1.5px solid;padding:3px 9px}
.delta.up{color:#1E6B33;border-color:#1E6B33}
.delta.down{color:var(--r-600);border-color:var(--r-600)}
.warnline{border:1.5px dashed var(--mut);padding:12px 16px;font-size:13.5px;color:var(--mut);margin-bottom:24px}

.subnav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin-bottom:24px}
.subnav button{font-family:var(--fd);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 16px;border:2px solid transparent;border-bottom:none;color:var(--mut);margin-bottom:-2px}
.subnav button:hover{color:var(--ink)}
.subnav button.on{border-color:var(--ink);background:#fff;color:var(--r-600)}
.grp-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
.grp-head:first-child{margin-top:0}
.grp-head h4{font-family:var(--fd);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.grp-head .gl{flex:1;height:1.5px;background:var(--ink)}
.grp-head .gc{font-family:var(--fm);font-size:11.5px;color:var(--mut)}

.logline{display:flex;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.logline:last-child{border-bottom:none}
.logline .lt{font-family:var(--fm);font-size:11px;color:var(--mut);width:120px;flex:none}
.logline .lk{font-family:var(--fd);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink);padding:2px 8px;flex:none}
.logline .lk.a-ingreso{background:var(--ink);color:#fff}
.logline .lk.a-baja{background:var(--r-600);border-color:var(--r-600);color:#fff}
.logline .lm{flex:1}

.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.loc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.loc-chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);padding:6px 6px 6px 12px;font-family:var(--fm);font-size:12px;background:#fff}
.loc-chip button{padding:3px;color:var(--r-600)}
.loc-chip button:hover{background:var(--r-600);color:#fff}
.addrrow{display:flex;gap:10px;margin-top:14px}

const MS_W = 7*86400000;
function isoWeekOf(ms){
  const d=new Date(ms); const dn=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dn);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return {year:d.getUTCFullYear(), week:Math.ceil(((d-ys)/86400000+1)/7)};
}
const weekKeyOf = ms=>{const{year,week}=isoWeekOf(ms);return `${year}-S${String(week).padStart(2,'0')}`};
const nowWK = ()=>weekKeyOf(Date.now());
const parseWK = k=>{const[y,w]=k.split('-S');return{year:+y,week:+w}};
const dateOfWK = k=>{const{year,week}=parseWK(k);return new Date(Date.UTC(year,0,1+(week-1)*7))};
const prevWK = k=>weekKeyOf(dateOfWK(k).getTime()-MS_W);
const weeksDiff = (a,b)=>Math.round((dateOfWK(b)-dateOfWK(a))/MS_W);
const fmtW = k=>{const{year,week}=parseWK(k);return `Semana ${String(week).padStart(2,'0')} · ${year}`};
const fmtTs = ts=>{const d=new Date(ts);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

/* ---- Clasificación: prefijos + palabras clave en tipo/observaciones/ubicación ---- */
function firstSeenWeek(ref){
  let best=null;
  for(const it of store.items) if(it.ref===ref && (best===null || it.week<best)) best=it.week;
  return best;
}
function classify(ref,tipo,wk,obs,loc){
  const r=(ref||'').toUpperCase(), t=(tipo||'').toUpperCase(), o=(obs||'').toUpperCase(), u=(loc||'').toUpperCase();
  const th=store.cfg.threshold;
  const has=k=>t.includes(k)||o.includes(k)||u.includes(k);
  if(/^ENS-/.test(r)||r.includes('ENSAYO')||has('ENSAYO')||has('PRUEBA'))
    return {kind:'assay', label:'Muestra para ensayo', rule:1,
      reason:'Se detectó ENSAYO o PRUEBA en la referencia, el tipo u observaciones → Muestra para ensayo'};
  if(/^IMP-/.test(r)||r.includes('IMPORT')||has('IMPORT'))
    return {kind:'import', label:'Muestra de importación', rule:2,
      reason:'Se detectó IMPORT / IMPORTADO en la referencia, el tipo u observaciones → Muestra de importación'};
  if(/^FIJ-/.test(r)||r.includes('FIJO')||has('FIJO'))
    return {kind:'fixed', label:'Inventario fijo', rule:3,
      reason:'Se detectó FIJO en la referencia, el tipo u observaciones → Inventario fijo'};
  if(has('MUESTRA'))
    return {kind:'import', label:'Muestra de importación', rule:4,
      reason:'El ítem contiene la palabra MUESTRA (sin datos de ensayo) → Muestra de importación'};
  if(has('LIBERADO'))
    return {kind:'release', label:'Liberar', rule:5,
      reason:'El texto indica PRODUCTO LIBERADO → se sugiere liberar'};
  const seen=firstSeenWeek(ref||'');
  const w=seen ? Math.max(0,weeksDiff(seen,wk)) : 0;
  if(seen && w>=th)
    return {kind:'release', label:'Liberar', rule:6, weeks:w,
      reason:`Sin clasificar · ${w} semana${w===1?'':'s'} en bodega (umbral: ${th}) → se sugiere liberar`};
  return {kind:'move', label:'Trasladar', rule:6, weeks:w,
          reason: seen ? `Sin clasificar · ${w} semana${w===1?'':'s'} en bodega → trasladar a zona definida` : 'Referencia nueva sin coincidencia con las reglas 1–5 → revisar y trasladar'};
}

  'Contiene FIJO, o la referencia inicia con FIJ- → Inventario fijo',

const itemsOfWeek = wk=>store.items.filter(i=>i.week===wk);
function aggByRef(wk){
  const m=new Map();
  for(const it of itemsOfWeek(wk)){
    if(!m.has(it.ref)) m.set(it.ref,{ref:it.ref,desc:it.desc,qty:0,loc:it.loc,tipo:it.tipo,obs:it.obs,weeks:[it.week],item:it});
    const e=m.get(it.ref); e.qty+=Number(it.qty)||0; e.weeks.push(it.week);
  }
  return m;
}
function compareWeeks(wk){
  const prev=prevWK(wk), A=aggByRef(prev), B=aggByRef(wk);
  const out=[],inn=[],chg=[];
  for(const [ref,e] of A) if(!B.has(ref)) out.push(e);
  for(const [ref,e] of B) if(!A.has(ref)) inn.push(e);
  for(const [ref,e] of B) if(A.has(ref)){const a=A.get(ref);
    if(a.qty!==e.qty || a.loc!==e.loc) chg.push({ref,from:a,to:e});}
  const q=m=>[...m.values()].reduce((s,e)=>s+e.qty,0);
  return {prev, out, inn, chg, qA:q(A), qB:q(B), hasPrev:A.size>0};
}
const outSorted = o=>[...o].sort((a,b)=>a.ref.localeCompare(b.ref));

function dlCSV(name,rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');

  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

  } else if(!e.ref.trim()){

  $('#vd-rules').innerHTML=RULES_TXT.map((t,i)=>{
    const hit=c2 && c2.rule===i+1;

    return `<li class="${hit?'hit':''}"><span class="rn">R${i+1}</span><span class="rt">${esc(txt)}</span></li>`;
  }).join('');

/* ---------- Importación con detección de columnas ---------- */
const IMP_FIELDS=[['','— ignorar —'],['ref','Referencia *'],['desc','Descripción'],['qty','Cantidad *'],
  ['tipo','Tipo'],['loc','Ubicación'],['week','Semana'],['obs','Observaciones']];
const IMP_HEADERS={
  ref:['referencia','referencias','ref','codigo','cod','item','id'],
  desc:['descripcion','desc','articulo','nombre','producto','detalle','material'],
  qty:['cantidad','cantidades','cant','qty','unidades','und','existencia','existencias'],
  tipo:['tipo','clase','categoria'],
  loc:['ubicacion','zona','bodega','loc','ubicacionactual'],
  week:['semana','semanas','week'],
  obs:['observaciones','observacion','notas','nota','comentarios','comentario','estado','descripcionestado']
};
const normHd=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

function parseGrid(text){
  const clean=String(text||'').replace(/^\ufeff/,'').replace(/\r\n?/g,'\n');
  const lines=clean.split('\n').map(l=>l.trim()).filter(l=>l!=='');
  if(!lines.length) return {grid:[],hasHeader:false};
  const delim = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
  const grid=lines.map(l=>l.split(delim).map(c=>c.trim()));
  const hasHeader=grid[0].map(normHd).some(h=>Object.values(IMP_HEADERS).some(arr=>arr.includes(h)));
  return {grid,hasHeader};
}
function mapFromHeaders(head,n){
  const m=new Array(n).fill('');
  head.forEach((h,i)=>{ if(i>=n) return; const hn=normHd(h); let f='';
    for(const k in IMP_HEADERS) if(IMP_HEADERS[k].includes(hn)){f=k;break;}
    m[i]=f; });
  return m;
}
function guessMap(grid){
  const n=Math.max(...grid.map(r=>r.length));
  const vals=i=>grid.map(r=>(r[i]||'').trim()).filter(v=>v!=='');
  const m=new Array(n).fill('');
  if(n>0)m[0]='ref'; if(n>1)m[1]='desc'; if(n>2)m[2]='qty';
  let shortUsed=0;
  for(let i=3;i<n;i++){
    const v=vals(i); if(!v.length){m[i]='';continue;}
    const isWk=v.every(x=>/^(19|20)\d{2}-?S?\d{1,2}$/i.test(x)||/^S(0?\d|1[0-2])$/i.test(x));
    if(isWk && !m.includes('week')){m[i]='week';continue;}
    const uniq=new Set(v.map(x=>x.toUpperCase())).size;
    const avg=v.reduce((s,x)=>s+x.length,0)/v.length;
    if(avg<=14 && uniq<=Math.max(3,Math.round(grid.length*0.4))){
      if(shortUsed===0){m[i]='tipo';shortUsed=1;}
      else if(shortUsed===1){m[i]='loc';shortUsed=2;}
      else m[i]='obs';
    } else m[i]='obs';
  }
  return m;
}
function mapRows(data,map){
  const im=state.enter.imp;
  return data.map((c,i)=>{
    const g=k=>{const idx=map.indexOf(k);return idx>=0?(c[idx]||''):'';};
    const ref=(g('ref')||'').toUpperCase();
    const desc=g('desc'), tipo=g('tipo'), loc=g('loc'), obs=g('obs'), weekRaw=g('week');
    const qtyRaw=g('qty');
    const qty=parseInt(String(qtyRaw).replace(/[^\d-]/g,''),10);
    let week=im.week, error='';
    if(!ref) error='Falta la referencia.';
    if(!error && (qtyRaw===''||isNaN(qty)||qty<0))
      error=qtyRaw===''?'Falta la cantidad.':`Cantidad no válida: “${qtyRaw}”.`;
    if(!error && weekRaw){
      const w=String(weekRaw).toUpperCase().replace(/\s/g,'');
      let m=w.match(/^(\d{4})-?S(\d{1,2})$/);
      if(m) week=m[1]+'-S'+String(+m[2]).padStart(2,'0');
      else{
        m=w.match(/^S?(\d{1,2})$/);
        if(m) week=String(new Date().getFullYear())+'-S'+String(+m[1]).padStart(2,'0');
        else error=`Semana no reconocida: “${weekRaw}” (usa 2026-S07, S07 o 7).`;
      }
    }
    return {line:i+1,ref,desc,tipo,loc,obs,qtyRaw,qty:(!isNaN(qty)&&qty>=0)?qty:null,week,error,
      exists: ref? !!store.items.find(x=>x.week===week && x.ref===ref):false};
  });
}

    <div class="panel-head"><span class="idx">4</span><h3>Vista previa</h3><div class="spacer"></div>
      <span class="sec-meta" id="imp-count"></span>
      <button class="btn small primary no-print" id="imp-go" disabled><i data-lucide="stamp"></i> Importar</button></div>
    <div class="tscroll"><table>
      <thead><tr><th>Línea</th><th>Ref.</th><th>Descripción</th><th class="r">Cant.</th><th>Tipo</th><th>Ubicación</th><th>Semana</th><th>Clasificación</th><th>Estado</th></tr></thead>
      <tbody id="imp-tbody"></tbody>
    </table></div>
  </div>`;
  icons(); bindModeBar();

  const getGrid=()=>parseGrid($('#imp-text').value);
  const impRows=()=>{
    if(!im.map) return [];
    const {grid,hasHeader}=getGrid();
    const data=hasHeader?grid.slice(1):grid;
    return mapRows(data,im.map);
  };
  const refreshMap=()=>{
    const {grid,hasHeader}=getGrid();
    const n=grid.length?Math.max(...grid.map(r=>r.length)):0;
    const box=$('#imp-map');
    if(!n){
      im.map=null; im.ncols=0;
      box.innerHTML='<span style="color:var(--mut);font-size:13px">Pega o carga datos arriba: las columnas se detectarán solas.</span>';
      paintPreview(); return;
    }
    if(im.map==null||im.ncols!==n||im.map.length!==n){
      im.map = hasHeader? mapFromHeaders(grid[0],n) : guessMap(grid);
      im.ncols=n;
    }
    box.innerHTML=im.map.map((f,i)=>{
      const colV=grid.slice(hasHeader?1:0).map(r=>(r[i]||'').trim()).filter(v=>v!=='');
      const sample=colV[0]||'';
      return `<div class="colmap-item"><span class="cm-l">COLUMNA ${i+1}</span>
        <select class="sel" data-ci="${i}">${IMP_FIELDS.map(([v,l])=>`<option value="${v}" ${f===v?'selected':''}>${l}</option>`).join('')}</select>
        <span class="cm-s" title="${esc(sample)}">Ej: ${esc(sample.length>22?sample.slice(0,22)+'…':sample)||'—'}</span></div>`;
    }).join('');
    $$('#imp-map select').forEach(s=>s.onchange=()=>{im.map[+s.dataset.ci]=s.value;paintPreview();});
    paintPreview();
  };
  const paintPreview=()=>{
    const rows=impRows();
    const ok=rows.filter(r=>!r.error);
    const bad=rows.length-ok.length;
    $('#imp-count').textContent=rows.length?`${ok.length} LISTA${ok.length===1?'':'S'} · ${bad} CON ERROR${bad===1?'':'ES'}`:'';
    $('#imp-go').disabled=!ok.length;
    $('#imp-tbody').innerHTML=rows.length? rows.map(r=>{
      const c=r.error?null:classify(r.ref,r.tipo,r.week,r.obs,r.loc);
      return `<tr class="${r.error?'imp-bad':''}">
        <td class="mono" style="font-size:11px;color:var(--mut)">${r.line}</td>
        <td class="mono">${esc(r.ref)||'—'}</td>
        <td style="font-size:12.5px">${esc(r.desc)||'—'}</td>
        <td class="r mono num">${esc(r.qtyRaw)||'—'}</td>
        <td style="font-size:12.5px">${locDisp(r.tipo)}</td>
        <td style="font-size:12.5px">${r.loc?esc(r.loc):(im.loc?esc(im.loc)+' <span style="color:var(--mut)">(defecto)</span>':'<span style="color:var(--mut)">—</span>')}</td>
        <td class="mono" style="font-size:12px">${esc(r.week)}</td>
        <td>${c?tagFor(c):'<span style="color:var(--mut)">—</span>'}</td>
        <td>${r.error?`<span class="state-bad">${esc(r.error)}</span>`:`<span class="state-ok">Lista</span>${r.exists?'<span class="sub">ya existe: se '+(im.sumDup?'sumará':'omitirá')+'</span>':''}`}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="9"><div class="empty"><i data-lucide="clipboard"></i><p>Pega tus datos o carga el archivo para ver la vista previa.</p></div></td></tr>`;
    icons();
  };

  $('#imp-text').addEventListener('input',refreshMap);
  $('#imp-week').onchange=e=>{im.week=e.target.value;paintPreview();};
  $('#imp-loc').onchange=e=>{im.loc=e.target.value;};
  $('#imp-dup').onchange=e=>{im.sumDup=e.target.value==='sum';paintPreview();};
  $('#imp-file-btn').onclick=()=>$('#imp-file').click();
  $('#imp-file').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{ $('#imp-text').value=String(rd.result||''); refreshMap();
      toast('Archivo cargado. Revisa la vista previa.','ok','file-up'); };
    rd.readAsText(f,'UTF-8');
    e.target.value='';
  };
  $('#imp-tpl').onclick=()=>{
    dlCSV('gricol_plantilla_importar.csv',[
      ['Referencia','Descripción','Cantidad','Tipo','Ubicación','Semana','Observaciones'],
      ['02-0011-09','CARTUCHO MONOMANDO CH35',1,'MUESTRA','','MUESTRA IMPORTADO - PRODUCTO LIBERADO'],
      ['02-0900-211','PRUEBAS - SIFÓN METAL',1,'PRUEBA','','PRUEBAS - MUEBLE GRIS'],
      ['IMP-0600','Válvula de bola 1/2"',24,'Repuesto','Zona de Muestras','']
    ]);
    toast('Plantilla descargada. Ábrela con Excel.','ok','file-down');
  };
  $('#imp-go').onclick=()=>{
    const rows=impRows();
    const ok=rows.filter(r=>!r.error);
    if(!ok.length) return;
    const bad=rows.length-ok.length;
    const groups=new Map();
    for(const r of ok){
      const key=r.ref+'|'+r.week;
      if(!groups.has(key)) groups.set(key,{ref:r.ref,desc:'',qty:0,tipo:r.tipo,loc:r.loc||im.loc||'',week:r.week,obs:''});
      const g=groups.get(key); g.qty+=r.qty;
      if(r.desc && !g.desc) g.desc=r.desc;
      if(r.obs) g.obs=g.obs?g.obs+' · '+r.obs:r.obs;
      if(r.tipo && !g.tipo) g.tipo=r.tipo;
      if(r.loc && !g.loc) g.loc=r.loc;
    }
    const items=store.items;
    let added=0,addedQty=0,merged=0,mergedQty=0,skipped=0; const newLocs=[];
    for(const g of groups.values()){
      const dup=items.find(i=>i.week===g.week && i.ref===g.ref);
      if(dup){
        if(im.sumDup){ dup.qty+=g.qty; dup.ts=Date.now(); if(g.desc)dup.desc=g.desc;
          if(g.obs)dup.obs=dup.obs?dup.obs+' · '+g.obs:g.obs; merged++; mergedQty+=g.qty; }
        else skipped++;
      } else {
        if(g.loc && !store.locs.includes(g.loc)){ store.locs=[...store.locs,g.loc]; newLocs.push(g.loc); }
        items.push({id:uid(),ref:g.ref,desc:g.desc||'—',qty:g.qty,tipo:g.tipo||'',loc:g.loc,week:g.week,obs:g.obs,ts:Date.now()});
        added++; addedQty+=g.qty;
      }
    }
    store.items=items;
    if(!persistCheck(items.length)) showStorWarn();
    logEvent('importación',`Carga masiva: ${added} refs nuevas (${addedQty} und), ${merged} sumadas (${mergedQty} und), ${skipped} omitidas${bad?`, ${bad} filas con error`:''}`);
    $('#imp-text').value=''; refreshMap();
    openModal(`<div class="m-head"><i data-lucide="check-circle-2"></i><h3>Importación completada</h3>
      <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="m-body"><ul class="alist">
        <li><span class="ix">+${added}</span><div class="body"><div class="r1"><b class="ref">Referencias nuevas</b></div><div class="why">${addedQty} unidades agregadas · semana ${esc(im.week)} para filas sin semana.</div></div></li>
        ${merged?`<li><span class="ix">Σ${merged}</span><div class="body"><div class="r1"><b class="ref">Ya existían — cantidades sumadas</b></div><div class="why">${mergedQty} unidades adicionadas.</div></div></li>`:''}
        ${skipped?`<li><span class="ix">${skipped}</span><div class="body"><div class="r1"><b class="ref">Omitidas (ya existían)</b></div><div class="why">Elegiste no sumar cantidades.</div></div></li>`:''}
        ${bad?`<li><span class="ix" style="color:var(--r-600)">${bad}</span><div class="body"><div class="r1"><b class="ref" style="color:var(--r-600)">Filas con error — no importadas</b></div><div class="why">Corrígelas en Excel y vuelve a pegar solo esas.</div></div></li>`:''}
        ${newLocs.length?`<li><span class="ix">U</span><div class="body"><div class="r1"><b class="ref">Ubicaciones nuevas desde el Excel</b></div><div class="why">${esc(newLocs.join(' · '))}</div></div></li>`:''}
      </ul></div>
      <div class="m-foot"><button class="btn" onclick="closeModal()">Cerrar</button>
      <button class="btn primary" id="m-goinv"><i data-lucide="list"></i> Ver inventario</button></div>`);
    $('#m-goinv').onclick=()=>{state.inv.week='all';closeModal();setView('inv');};
  };
  refreshMap();
}

/* ================= 03 · INVENTARIO ================= */
function vInv(){
  const f=state.inv;
  const weekOpts=[...new Set(store.items.map(i=>i.week))].sort((a,b)=>b.localeCompare(a));
  if(f.week!=='all' && !weekOpts.includes(f.week)) f.week='all';
  const wk=f.week==='all'?null:f.week;
  const wkLabel = wk?fmtW(wk):'Todas las semanas';
  $('#view').innerHTML=secHead('03','Inventario',wkLabel)+`
  <div class="filters no-print">
    <div class="searchbox"><i data-lucide="search"></i>
      <input class="input" id="fl-q" placeholder="Buscar referencia o descripción…" value="${esc(f.q)}"></div>
    <select class="sel" id="fl-week">
      <option value="all" ${f.week==='all'?'selected':''}>Todas las semanas</option>
      ${weekOpts.map(w=>`<option value="${w}" ${f.week===w?'selected':''}>${w}${w===nowWK()?' — actual':''}</option>`).join('')}
    </select>
    <select class="sel" id="fl-loc">
      <option value="all">Todas las ubicaciones</option>
      <option value="__none" ${f.loc==='__none'?'selected':''}>— Sin ubicación —</option>
      ${store.locs.map(l=>`<option ${f.loc===l?'selected':''}>${esc(l)}</option>`).join('')}
    </select>
    <div class="chips" id="fl-chips"></div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx" id="inv-count"></span><div class="spacer"></div>
      <button class="btn small no-print" id="inv-csv"><i data-lucide="download"></i> CSV vista</button></div>
    <div class="tscroll"><table>
      <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant.</th><th>Tipo</th><th>Clasificación</th><th>Ubicación</th><th>Semana</th><th></th></tr></thead>
      <tbody id="inv-tbody"></tbody>
    </table></div>
  </div>`;
  icons();
  const CLS=[['all','Todos'],['fixed','Fijo'],['import','Importación'],['assay','Ensayo'],['move','Trasladar'],['release','Liberar']];
  const paintChips=()=>{
    const base=store.items.filter(i=>!wk||i.week===wk)
      .filter(i=>f.loc==='all'||(f.loc==='__none'?!i.loc:i.loc===f.loc))
      .filter(i=>!f.q||(i.ref+' '+i.desc).toUpperCase().includes(f.q.toUpperCase()));
    $('#fl-chips').innerHTML=CLS.map(([k,l])=>{
      const n=k==='all'?base.length:base.filter(i=>classify(i.ref,i.tipo,i.week,i.obs,i.loc).kind===k).length;
      return `<button class="chip ${f.cls===k?'on':''}" data-c="${k}">${l}<span class="cn num">${n}</span></button>`;
    }).join('');
    $$('#fl-chips .chip').forEach(ch=>ch.onclick=()=>{f.cls=ch.dataset.c;paintChips();paintRows();});
  };
  const paintRows=()=>{
    let rows=store.items.filter(i=>(!wk||i.week===wk)&&(f.loc==='all'||(f.loc==='__none'?!i.loc:i.loc===f.loc)));
    if(f.cls!=='all') rows=rows.filter(i=>classify(i.ref,i.tipo,i.week,i.obs,i.loc).kind===f.cls);
    if(f.q){const q=f.q.toUpperCase(); rows=rows.filter(i=>(i.ref+' '+i.desc).toUpperCase().includes(q));}
    rows.sort((a,b)=>a.ref.localeCompare(b.ref)||a.week.localeCompare(b.week));
    $('#inv-count').textContent=`${rows.length} LÍNEA${rows.length===1?'':'S'} · ${rows.reduce((s,i)=>s+(Number(i.qty)||0),0)} UND`;
    $('#inv-tbody').innerHTML=rows.length? rows.map(it=>{
      const c=classify(it.ref,it.tipo,it.week,it.obs,it.loc);
      return `<tr>
        <td class="mono">${esc(it.ref)}</td>
        <td>${esc(it.desc)}${it.obs?`<span class="obs">${esc(it.obs)}</span>`:''}</td>
        <td class="r mono num">${it.qty}</td>
        <td style="font-size:12.5px">${locDisp(it.tipo)}</td>
        <td>${tagFor(c)}<span class="sub">${esc(c.reason)}</span></td>
        <td style="font-size:12.5px;white-space:nowrap">${locDisp(it.loc)}</td>
        <td class="mono" style="font-size:12px">${it.week}</td>
        <td><div class="rowacts no-print">
          <button class="btn icon" title="Editar" data-ed="${it.id}"><i data-lucide="pencil"></i></button>
          <button class="btn icon danger" title="Eliminar" data-del="${it.id}"><i data-lucide="trash-2"></i></button>
        </div></td></tr>`;
    }).join('') : `<tr><td colspan="8"><div class="empty"><i data-lucide="inbox"></i><p>Sin resultados con los filtros actuales.</p></div></td></tr>`;
    icons();
    $$('#inv-tbody [data-ed]').forEach(b=>b.onclick=()=>editModal(b.dataset.ed,()=>{paintChips();paintRows();}));
    $$('#inv-tbody [data-del]').forEach(b=>b.onclick=()=>deleteModal(b.dataset.del,()=>{paintChips();paintRows();}));
  };
  $('#fl-q').addEventListener('input',e=>{f.q=e.target.value;paintChips();paintRows();});
  $('#fl-week').onchange=e=>{f.week=e.target.value;vInv();};
  $('#fl-loc').onchange=e=>{f.loc=e.target.value;paintChips();paintRows();};
  $('#inv-csv').onclick=()=>{
    const rows=store.items.filter(i=>(!wk||i.week===wk)&&(f.loc==='all'||(f.loc==='__none'?!i.loc:i.loc===f.loc))).map(itemRow);
    dlCSV(`gricol_inventario_${wk||'todo'}.csv`,[CSV_HEAD,...rows]);
    toast('CSV descargado.','ok','download');
  };
  paintChips(); paintRows();
}
function editModal(id,after){
  const it=store.items.find(i=>i.id===id); if(!it)return;
  openModal(`<div class="m-head"><i data-lucide="pencil"></i><h3>Editar ítem — ${esc(it.ref)}</h3>
    <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
  <div class="m-body"><div class="frows">
    <div class="field full"><label>Descripción</label><input class="input" id="m-desc" value="${esc(it.desc)}"></div>
    <div class="field"><label>Cantidad</label><input class="input num" id="m-qty" type="number" min="0" value="${it.qty}"></div>
    <div class="field"><label>Tipo</label><select class="input" id="m-tipo"><option value="" ${!it.tipo?'selected':''}>— sin tipo —</option>${TIPOS.map(t=>`<option ${t===it.tipo?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Ubicación</label><select class="input" id="m-loc"><option value="" ${!it.loc?'selected':''}>— sin ubicación —</option>${store.locs.map(l=>`<option ${l===it.loc?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="field"><label>Semana</label><select class="input" id="m-week">${[...new Set([it.week,nowWK(),...store.items.map(x=>x.week)])].sort((a,b)=>b.localeCompare(a)).map(w=>`<option ${w===it.week?'selected':''}>${w}</option>`).join('')}</select></div>
    <div class="field full"><label>Observaciones</label><textarea class="input" id="m-obs">${esc(it.obs)}</textarea></div>
  </div></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn primary" id="m-save"><i data-lucide="check"></i> Guardar cambios</button></div>`);
  $('#m-save').onclick=()=>{
    const qty=Number($('#m-qty').value);
    if(isNaN(qty)||qty<0){toast('Cantidad inválida.','err');return;}
    Object.assign(it,{desc:$('#m-desc').value.trim()||'—',qty,tipo:$('#m-tipo').value,
      loc:$('#m-loc').value,week:$('#m-week').value,obs:$('#m-obs').value.trim(),ts:Date.now()});
    store.items=[...store.items];
    logEvent('edición',`${it.ref} · modificado (${it.qty} und · ${it.week})`);
    closeModal(); toast('Cambios guardados.','ok','check'); after&&after();
  };
}
function deleteModal(id,after){
  const it=store.items.find(i=>i.id===id); if(!it)return;
  openModal(`<div class="m-head"><i data-lucide="trash-2"></i><h3>Eliminar ítem</h3>
    <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
  <div class="m-body">¿Eliminar <b class="mono">${esc(it.ref)}</b> — ${esc(it.desc)} (${it.qty} und · ${it.week})?<br>
  <span style="color:var(--mut);font-size:13px">Esta acción queda registrada en la bitácora y no se puede deshacer.</span></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn red" id="m-del"><i data-lucide="trash-2"></i> Eliminar</button></div>`);
  $('#m-del').onclick=()=>{
    store.items=store.items.filter(i=>i.id!==id);
    logEvent('baja',`${it.ref} · eliminado (${it.qty} und · ${it.week})`);
    closeModal(); toast('Ítem eliminado.','warn','trash-2'); after&&after();
  };
}

/* ================= 04 · COMPARATIVO ================= */
function vCmp(){
  const wk=state.cmp.week, cmp=compareWeeks(wk);
  const weekOpts=[...new Set([nowWK(),...store.items.map(i=>i.week)])].sort((a,b)=>b.localeCompare(a));
  const delta=cmp.qB-cmp.qA;
  const outT = cmp.out.length? `<table>
    <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant. final</th><th>Última ubicación</th><th>Estado</th></tr></thead>
    <tbody>${outSorted(cmp.out).map(e=>`<tr>
      <td class="mono">${esc(e.ref)}</td><td>${esc(e.desc)}</td><td class="r mono num">${e.qty}</td>
      <td style="font-size:12.5px">${locDisp(e.loc)}</td>
      <td><span class="stamp sm c-release">Salida efectiva del inventario</span></td></tr>`).join('')}</tbody></table>`
    : `<div class="empty"><i data-lucide="check"></i><p>Todas las referencias de la semana ${parseWK(cmp.prev).week} continúan en la semana ${parseWK(wk).week}.</p></div>`;
  const innT = cmp.inn.length? `<table>
    <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant.</th><th>Ubicación</th><th>Clasificación</th></tr></thead>
    <tbody>${outSorted(cmp.inn).map(e=>{const c=classify(e.ref,e.tipo,wk,e.obs,e.loc);return`<tr>
      <td class="mono">${esc(e.ref)}</td><td>${esc(e.desc)}</td><td class="r mono num">${e.qty}</td>
      <td style="font-size:12.5px">${locDisp(e.loc)}</td><td>${tagFor(c)}</td></tr>`}).join('')}</tbody></table>`
    : `<div class="empty"><i data-lucide="inbox"></i><p>Sin referencias nuevas frente a la semana anterior.</p></div>`;
  const chgT = cmp.chg.length? `<table>
    <thead><tr><th>Ref.</th><th>Cantidad</th><th>Ubicación</th></tr></thead>
    <tbody>${outSorted(cmp.chg).map(x=>`<tr>
      <td class="mono">${esc(x.ref)}<span class="sub">${esc(x.to.desc)}</span></td>
      <td class="mono num" style="font-size:12.5px">${x.from.qty} → <b>${x.to.qty}</b>
        ${x.from.qty!==x.to.qty?`<span class="delta ${x.to.qty>x.from.qty?'up':'down'}" style="margin-left:6px">${x.to.qty>x.from.qty?'+':''}${x.to.qty-x.from.qty}</span>`:''}</td>
      <td class="mono" style="font-size:12.5px">${locDisp(x.from.loc)} → <b>${locDisp(x.to.loc)}</b></td></tr>`).join('')}</tbody></table>`
    : `<div class="empty"><i data-lucide="minus"></i><p>Sin cambios en referencias continuas.</p></div>`;

  $('#view').innerHTML=secHead('04','Comparativo semanal','VS SEMANA ANTERIOR')+`
  <div class="cmp-head no-print">
    <span style="font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--mut)">SEMANA A COMPARAR</span>
    <select class="sel" id="cmp-week">${weekOpts.map(w=>`<option value="${w}" ${w===wk?'selected':''}>${w}${w===nowWK()?' — actual':''}</option>`).join('')}</select>
    <div class="cmp-arrow"><span class="wk">${wk}</span><i data-lucide="arrow-right"></i><span class="wk" style="background:#fff">${cmp.prev}</span></div>
    <span class="delta ${delta<0?'down':'up'}">${delta>=0?'+':''}${delta} UND</span>
  </div>
  ${cmp.hasPrev?'':`<div class="warnline"><i data-lucide="alert-triangle" style="width:14px;height:14px;vertical-align:-2px"></i> No hay datos de la semana anterior (${cmp.prev}). El comparativo solo refleja la semana seleccionada.</div>`}
  <div class="band no-print">
    <div class="kpi"><div class="v num">${cmp.qA}</div><div class="l">Und. semana ${parseWK(cmp.prev).week}</div></div>
    <div class="kpi"><div class="v num">${cmp.qB}</div><div class="l">Und. semana ${parseWK(wk).week}</div></div>
    <div class="kpi"><div class="v num ${cmp.out.length?'alert':''}">${cmp.out.length}</div><div class="l">Salidas efectivas</div></div>
    <div class="kpi"><div class="v num">${cmp.inn.length}</div><div class="l">Ingresos nuevos</div></div>
    <div class="kpi"><div class="v num">${cmp.chg.length}</div><div class="l">Referencias con cambios</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx">A</span><h3>Salidas — referencias que ya no aparecen</h3>
      ${cmp.out.length?`<span class="stamp sm c-release">Salida efectiva del inventario</span>`:''}</div>
    <div class="tscroll">${outT}</div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx">B</span><h3>Ingresos nuevos de la semana</h3></div>
    <div class="tscroll">${innT}</div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx">C</span><h3>Cambios en referencias continuas</h3></div>
    <div class="tscroll">${chgT}</div>
  </div>`;
  icons();
  $('#cmp-week').onchange=e=>{state.cmp.week=e.target.value;vCmp();};
}

/* ================= 05 · REPORTES ================= */
function vRep(){
  const r=state.rep, wk=r.week;
  const weekOpts=[...new Set(store.items.map(i=>i.week))].sort((a,b)=>b.localeCompare(a));
  if(!weekOpts.includes(wk)) r.week=weekOpts[0]||nowWK();
  const useWk=r.week;
  const tabs=[['tipo','Por tipo'],['ubicacion','Por ubicación'],['alertas','Alertas de acción'],['salidas','Salidas entre semanas'],['bitacora','Bitácora']];
  let body='';
  const groupTable=(key)=>{
    const map=new Map();
    for(const it of itemsOfWeek(useWk)){
      const k=it[key]||'Sin ubicación';
      if(!map.has(k))map.set(k,{refs:new Set(),qty:0});
      const e=map.get(k); e.refs.add(it.ref); e.qty+=Number(it.qty)||0;
    }
    const entries=[...map.entries()].sort((a,b)=>b[1].qty-a[1].qty);
    if(!entries.length) return `<div class="empty"><i data-lucide="inbox"></i><p>Sin datos en la semana ${useWk}.</p></div>`;
    return entries.map(([k,e])=>`
      <div class="grp-head"><h4>${esc(k)}</h4><div class="gl"></div><span class="gc num">${e.refs.size} ref · ${e.qty} und</span></div>
      <div class="tscroll"><table>
        <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant.</th><th>Clasificación</th><th>${key==='loc'?'Tipo':'Ubicación'}</th></tr></thead>
        <tbody>${itemsOfWeek(useWk).filter(i=>(i[key]||'Sin ubicación')===k).sort((a,b)=>a.ref.localeCompare(b.ref)).map(it=>{
          const c=classify(it.ref,it.tipo,useWk,it.obs,it.loc);
          return `<tr><td class="mono">${esc(it.ref)}</td><td>${esc(it.desc)}</td><td class="r mono num">${it.qty}</td>
            <td>${tagFor(c)}</td><td style="font-size:12.5px">${key==='loc'?locDisp(it.tipo):locDisp(it.loc)}</td></tr>`}).join('')}</tbody>
      </table></div>`).join('');
  };
  if(r.tab==='tipo') body=groupTable('tipo');
  else if(r.tab==='ubicacion') body=groupTable('loc');
  else if(r.tab==='alertas'){
    const rows=itemsOfWeek(useWk).map(it=>({it,c:classify(it.ref,it.tipo,useWk,it.obs,it.loc)})).filter(x=>x.c.kind==='move'||x.c.kind==='release');
    body=rows.length? `<div class="tscroll"><table>
      <thead><tr><th>Ref.</th><th class="r">Cant.</th><th>Ubicación</th><th>Acción</th><th>Motivo</th><th>Sem. en bodega</th></tr></thead>
      <tbody>${rows.map(({it,c})=>`<tr><td class="mono">${esc(it.ref)}<span class="sub">${esc(it.desc)}</span></td>
        <td class="r mono num">${it.qty}</td><td style="font-size:12.5px">${locDisp(it.loc)}</td>
        <td>${tagFor(c)}</td><td style="font-size:12.5px;color:var(--mut)">${esc(c.reason)}</td>
        <td class="mono num" style="font-size:12px">${c.weeks??'—'}${c.weeks!=null?' sem':''}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6">${rows.length} ÍTEM(ES) REQUIEREN ACCIÓN</td></tr></tfoot></table></div>`
      : `<div class="empty"><i data-lucide="check"></i><p>Ningún ítem requiere traslado ni liberación en la semana ${useWk}.</p></div>`;
  }
  else if(r.tab==='salidas'){
    const cmp=compareWeeks(useWk);
    body=cmp.out.length? `<div class="tscroll"><table>
      <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant. que salió</th><th>Última ubicación</th><th>Estado</th></tr></thead>
      <tbody>${outSorted(cmp.out).map(e=>`<tr><td class="mono">${esc(e.ref)}</td><td>${esc(e.desc)}</td>
        <td class="r mono num">${e.qty}</td><td style="font-size:12.5px">${locDisp(e.loc)}</td>
        <td><span class="stamp sm c-release">Salida efectiva del inventario</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="5">${cmp.out.length} REFERENCIA(S) SALIERON · SEMANA ${parseWK(cmp.prev).week} → ${parseWK(useWk).week}</td></tr></tfoot>
    </table></div>`
    : `<div class="empty"><i data-lucide="check"></i><p>Sin salidas entre la semana ${parseWK(cmp.prev).week} y la semana ${parseWK(useWk).week}.</p></div>`;
  }
  else {
    const L=store.log;
    body=L.length? L.slice(0,40).map(e=>`<div class="logline"><span class="lt">${fmtTs(e.ts)}</span>
      <span class="lk a-${e.type}">${esc(e.type)}</span><span class="lm">${esc(e.msg)}</span></div>`).join('')
      : `<div class="empty"><i data-lucide="history"></i><p>Sin registros aún.</p></div>`;
  }
  $('#view').innerHTML=secHead('05','Reportes y alertas',fmtW(r.week))+`
  <div class="filters no-print">
    <select class="sel" id="rep-week">${weekOpts.map(w=>`<option value="${w}" ${w===r.week?'selected':''}>${w}${w===nowWK()?' — actual':''}</option>`).join('')}</select>
    <div class="spacer" style="flex:1"></div>
    <button class="btn small" id="rep-csv-wk"><i data-lucide="file-spreadsheet"></i> CSV semana</button>
    <button class="btn small" id="rep-csv-all"><i data-lucide="download"></i> CSV todo</button>
    <button class="btn small" id="rep-print"><i data-lucide="printer"></i> Imprimir</button>
  </div>
  <div class="subnav no-print">${tabs.map(([k,l])=>`<button data-t="${k}" class="${r.tab===k?'on':''}">${l}</button>`).join('')}</div>
  ${body}`;
  icons();
  $('#rep-week').onchange=e=>{r.week=e.target.value;vRep();};
  $$('.subnav button').forEach(b=>b.onclick=()=>{r.tab=b.dataset.t;vRep();});
  $('#rep-csv-wk').onclick=()=>{dlCSV(`gricol_reporte_${r.week}.csv`,[CSV_HEAD,...itemsOfWeek(r.week).map(itemRow)]);toast('CSV de la semana descargado.','ok','download');};
  $('#rep-csv-all').onclick=()=>{dlCSV('gricol_inventario_completo.csv',[CSV_HEAD,...store.items.map(itemRow)]);toast('CSV completo descargado.','ok','download');};
  $('#rep-print').onclick=()=>window.print();
}

/* ================= 06 · AJUSTES ================= */
function vSet(){
  $('#view').innerHTML=secHead('06','Ajustes','CONFIGURACIÓN LOCAL')+`
  <div class="set-grid">
    <div class="panel"><div class="panel-head"><span class="idx">A</span><h3>Cuenta de acceso</h3></div>
      <div class="panel-body">
        <p style="font-size:13.5px;margin-bottom:16px">Usuario actual: <b class="mono">${esc(store.auth.user)}</b></p>
        <form id="f-pass"><div class="frows">
          <div class="field full"><label>Contraseña actual</label><input class="input" type="password" id="p-old" autocomplete="current-password"></div>
          <div class="field"><label>Nueva contraseña</label><input class="input" type="password" id="p-new" autocomplete="new-password"></div>
          <div class="field"><label>Repetir nueva</label><input class="input" type="password" id="p-new2" autocomplete="new-password"></div>
        </div>
        <button class="btn primary" style="margin-top:18px"><i data-lucide="key-round"></i> Cambiar contraseña</button></form>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">B</span><h3>Regla de antigüedad</h3></div>
      <div class="panel-body">
        <p style="font-size:13.5px;margin-bottom:14px">Las referencias sin clasificar que acumulen este número de semanas en bodega pasan automáticamente a <b>LIBERAR</b>; antes de ese umbral se sugiere <b>TRASLADAR</b>.</p>
        <div class="field" style="max-width:220px"><label>Semanas para liberar</label>
          <input class="input num" type="number" min="1" max="20" id="cfg-th" value="${store.cfg.threshold}"></div>
        <button class="btn primary" style="margin-top:16px" id="cfg-save"><i data-lucide="check"></i> Guardar umbral</button>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">C</span><h3>Ubicaciones</h3></div>
      <div class="panel-body">
        <p style="font-size:13.5px;margin-bottom:6px">Las ubicaciones que traiga el Excel se añaden solas a esta lista.</p>
        <div class="loc-chips" id="loc-chips">${store.locs.map(l=>`<span class="loc-chip">${esc(l)}
          <button data-l="${esc(l)}" title="Quitar"><i data-lucide="x"></i></button></span>`).join('')}</div>
        <div class="addrrow"><input class="input" id="loc-new" placeholder="Nueva ubicación…">
          <button class="btn small" id="loc-add"><i data-lucide="plus"></i> Añadir</button></div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">D</span><h3>Datos</h3></div>
      <div class="panel-body">
        <p style="font-size:13.5px;margin-bottom:16px">Respalda o restablece la información guardada en este navegador.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn small" id="d-exp"><i data-lucide="download"></i> Respaldo JSON</button>
          <button class="btn small" id="d-imp-btn"><i data-lucide="file-up"></i> Importar respaldo</button>
          <input type="file" id="d-imp" accept=".json" hidden>
          <button class="btn small" id="d-seed"><i data-lucide="database"></i> Cargar ejemplo</button>
          <button class="btn small red" id="d-wipe"><i data-lucide="trash-2"></i> Borrar todo</button>
        </div>
      </div>
    </div>
  </div>
  <div class="panel"><div class="panel-head"><span class="idx">E</span><h3>Reglas de clasificación automática</h3></div>
    <div class="panel-body"><ul class="alist">
      ${RULES_TXT.map((t,i)=>`<li><span class="ix">R${i+1}</span><div class="body"><div class="why" style="margin:0;font-size:13.5px;color:var(--ink)">${esc(t)}</div></div></li>`).join('')}
    </ul>
    <p style="font-size:12.5px;color:var(--mut);margin-top:12px">Las reglas se evalúan en orden usando la referencia, el tipo, las observaciones y la ubicación de cada ítem. Así, un ítem del Excel que diga “MUESTRA IMPORTADO” o “PRUEBAS” se clasifica solo.</p></div>
  </div>`;
  icons();
  $('#f-pass').onsubmit=e=>{
    e.preventDefault();
    const a=store.auth;
    if(b64($('#p-old').value)!==a.hash){toast('La contraseña actual no coincide.','err');return;}
    if($('#p-new').value.length<4){toast('La nueva contraseña debe tener al menos 4 caracteres.','err');return;}
    if($('#p-new').value!==$('#p-new2').value){toast('Las contraseñas nuevas no coinciden.','err');return;}
    store.auth={...a,hash:b64($('#p-new').value)};
    logEvent('sesión','Cambio de contraseña de '+a.user);
    toast('Contraseña actualizada.','ok','key-round'); vSet();
  };
  $('#cfg-save').onclick=()=>{
    const th=Math.max(1,Math.min(20,Number($('#cfg-th').value)||3));
    store.cfg={threshold:th}; toast(`Umbral actualizado: ${th} semanas para liberar.`,'ok','check');
  };
  const paintLocs=()=>{
    $('#loc-chips').innerHTML=store.locs.map(l=>`<span class="loc-chip">${esc(l)}
      <button data-l="${esc(l)}"><i data-lucide="x"></i></button></span>`).join('');
    $$('#loc-chips button').forEach(b=>b.onclick=()=>{
      store.locs=store.locs.filter(x=>x!==b.dataset.l);
      toast(`Ubicación “${b.dataset.l}” eliminada de la lista.`,'warn','map-pin'); vSet();
    });
    icons();
  };
  $('#loc-add').onclick=()=>{
    const v=$('#loc-new').value.trim(); if(!v)return;
    if(store.locs.includes(v)){toast('Esa ubicación ya existe.','err');return;}
    store.locs=[...store.locs,v]; $('#loc-new').value='';
    toast('Ubicación añadida.','ok','map-pin'); vSet();
  };
  paintLocs();
  $('#d-exp').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify({items:store.items,locs:store.locs,cfg:store.cfg,log:store.log},null,2)],{type:'application/json'}));
    a.download='gricol_respaldo.json'; a.click(); URL.revokeObjectURL(a.href);
    toast('Respaldo descargado.','ok','download');
  };
  $('#d-imp-btn').onclick=()=>$('#d-imp').click();
  $('#d-imp').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.items)) throw 0;
      store.items=d.items; if(Array.isArray(d.locs))store.locs=d.locs;
      if(d.cfg)store.cfg=d.cfg; if(Array.isArray(d.log))store.log=d.log;
      toast(`Respaldo importado: ${d.items.length} líneas.`,'ok','check'); vSet();
    }catch{toast('El archivo no es un respaldo válido.','err');}};
    rd.readAsText(f);
  };
  $('#d-seed').onclick=()=>{
    openModal(`<div class="m-head"><i data-lucide="database"></i><h3>Cargar datos de ejemplo</h3>
      <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="m-body">Se reemplazará el inventario actual por un conjunto de demostración con dos semanas de historia, salidas y alertas. ¿Continuar?</div>
      <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" id="m-seed"><i data-lucide="database"></i> Cargar</button></div>`);
    $('#m-seed').onclick=()=>{
      lsRawDel('gricol_seeded'); store.items=[]; seedDemo();
      closeModal(); toast('Datos de ejemplo cargados.','ok','database'); vSet();
    };
  };
  $('#d-wipe').onclick=()=>{
    openModal(`<div class="m-head"><i data-lucide="trash-2"></i><h3>Borrar todos los datos</h3>
      <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="m-body">Se eliminarán <b>todos los ítems</b> y la bitácora de este navegador. La cuenta y las ubicaciones se conservan. ¿Continuar?</div>
      <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn red" id="m-wipe"><i data-lucide="trash-2"></i> Borrar todo</button></div>`);
    $('#m-wipe').onclick=()=>{
      store.items=[]; store.log=[]; lsRawDel('gricol_seeded');
      closeModal(); toast('Inventario vacío.','warn','trash-2'); setView('dashboard');
    };
  };
}

if(sessGet()) renderApp(); else renderLogin();
</script>
</body>
</html>
