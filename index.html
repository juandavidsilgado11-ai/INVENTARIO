      <div class="m-body"><ul class="alist">
        <li><span class="ix">+${added}</span><div class="body"><div class="r1"><b class="ref">Referencias nuevas</b></div><div class="why">${addedQty} unidades agregadas.</div></div></li>
         ${fijasReg?`<li><span class="ix" style="color:var(--r-600)">★${fijasReg}</span><div class="body"><div class="r1"><b class="ref">Referencias registradas como FIJAS</b></div><div class="why">Se repetirán automáticamente cada semana.</div></div></li>`:''}
        ${catReg?`<li><span class="ix" style="color:var(--r-600)">◉${catReg}</span><div class="body"><div class="r1"><b class="ref">Añadidas al catálogo</b></div><div class="why">Se guardó su cantidad estándar.</div></div></li>`:''}

        ${merged?`<li><span class="ix">Σ${merged}</span><div class="body"><div class="r1"><b class="ref">Ya existían — cantidades sumadas</b></div><div class="why">${mergedQty} unidades adicionadas.</div></div></li>`:''}
        ${excCreados?`<li><span class="ix" style="color:var(--amber)">⚠${excCreados}</span><div class="body"><div class="r1"><b class="ref" style="color:var(--amber)">Excedentes detectados</b></div><div class="why">${excQty} und creadas como <b>-EXC</b> para LIBERAR.</div></div></li>`:''}
        ${skipped?`<li><span class="ix">${skipped}</span><div class="body"><div class="r1"><b class="ref">Omitidas (ya existían)</b></div></div></li>`:''}
        ${bad?`<li><span class="ix" style="color:var(--r-600)">${bad}</span><div class="body"><div class="r1"><b class="ref" style="color:var(--r-600)">Filas con error — no importadas</b></div><div class="why">Corrígelas en Excel y vuelve a pegar solo esas.</div></div></li>`:''}
        ${newLocs.length?`<li><span class="ix">U</span><div class="body"><div class="r1"><b class="ref">Ubicaciones nuevas</b></div><div class="why">${esc(newLocs.join(' · '))}</div></div></li>`:''}
      </ul></div>
      <div class="m-foot"><button class="btn" onclick="closeModal()">Cerrar</button>
      <button class="btn primary" id="m-goinv"><i data-lucide="list"></i> Ver inventario</button></div>`);
    $('#m-goinv').onclick=()=>{closeModal();setView('inv');};
  };
  paintPreview();
}

// ================= 03 · INVENTARIO =================
function vInv(){
  const f=state.inv;
  const weekOpts=[...new Set(store.items.map(i=>i.week))].sort((a,b)=>b.localeCompare(a));
  const wk=f.week==='all'?null:f.week;
  const wkLabel = wk?fmtW(wk):'Todas las semanas';
  $('#view').innerHTML=secHead('03','Inventario',wkLabel)+`
  <div class="filters no-print">
    <div class="searchbox"><i data-lucide="search"></i>
      <input class="input" id="fl-q" placeholder="Buscar referencia o descripción…" value="${esc(f.q)}"></div>
    <select class="sel" id="fl-week">
      <option value="all" ${f.week==='all'?'selected':''}>Todas las semanas</option>
      ${weekOpts.map(w=>`<option value="${w}" ${f.week===w?'selected':''}>${fmtW(w)}${w===nowWK()?' — actual':''}</option>`).join('')}
    </select>
    <select class="sel" id="fl-loc">
      <option value="all">Todas las ubicaciones</option>
      ${store.locs.map(l=>`<option ${f.loc===l?'selected':''}>${esc(l)}</option>`).join('')}
    </select>
    <div class="chips" id="fl-chips"></div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx" id="inv-count"></span><div class="spacer"></div>
      <button class="btn small no-print" id="inv-csv"><i data-lucide="download"></i> CSV vista</button></div>
    <div class="tscroll"><table>
      <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant.</th><th>Tipo</th><th>Clasificación</th><th>Ubicación</th><th>Semana</th><th></th></tr></thead>
      <tbody id="inv-tbody"></tbody>
    </table></div>
  </div>`;
  icons();
  const CLS=[['all','Todos'],['fixed','Fijo'],['import','Importación'],['assay','Ensayo'],['move','Trasladar'],['release','Liberar'],['excess','Con excedente']];
  const paintChips=()=>{
    const base=store.items.filter(i=>!wk||i.week===wk).filter(i=>f.loc==='all'||i.loc===f.loc)
      .filter(i=>!f.q||(i.ref+' '+i.desc).toUpperCase().includes(f.q.toUpperCase()));
    $('#fl-chips').innerHTML=CLS.map(([k,l])=>{
      let n;
      if(k==='all') n=base.length;
      else if(k==='excess') n=base.filter(i=>classify(i.ref,i.tipo,i.week,i.qty).excedente>0).length;
      else n=base.filter(i=>classify(i.ref,i.tipo,i.week,i.qty).kind===k).length;
      return `<button class="chip ${f.cls===k?'on':''}" data-c="${k}">${l}<span class="cn num">${n}</span></button>`;
    }).join('');
    $$('#fl-chips .chip').forEach(ch=>ch.onclick=()=>{f.cls=ch.dataset.c;paintChips();paintRows();});
  };
  const paintRows=()=>{
    let rows=store.items.filter(i=>(!wk||i.week===wk)&&(f.loc==='all'||i.loc===f.loc));
    if(f.cls==='excess') rows=rows.filter(i=>classify(i.ref,i.tipo,i.week,i.qty).excedente>0);
    else if(f.cls!=='all') rows=rows.filter(i=>classify(i.ref,i.tipo,i.week,i.qty).kind===f.cls);
    if(f.q){const q=f.q.toUpperCase(); rows=rows.filter(i=>(i.ref+' '+i.desc).toUpperCase().includes(q));}
    rows.sort((a,b)=>a.ref.localeCompare(b.ref)||a.week.localeCompare(b.week));
    $('#inv-count').textContent=`${rows.length} LÍNEA${rows.length===1?'':'S'} · ${rows.reduce((s,i)=>s+(Number(i.qty)||0),0)} UND`;
    $('#inv-tbody').innerHTML=rows.length? rows.map(it=>{
      const c=classify(it.ref,it.tipo,it.week,it.qty);
      const excBadge=c.excedente>0?`<span class="tag t-excess" style="margin-left:6px">Excedente ${c.excedente} und → Liberar</span>`:'';
      return `<tr>
        <td class="mono">${esc(it.ref)}</td>
        <td>${esc(it.desc)}${it.obs?`<span class="obs">${esc(it.obs)}</span>`:''}</td>
        <td class="r mono num">${it.qty}</td>
        <td style="font-size:12.5px">${esc(it.tipo)}</td>
        <td>${tagFor(c)}${excBadge}<span class="sub">${esc(c.reason)}</span></td>
        <td style="font-size:12.5px;white-space:nowrap">${esc(it.loc)}</td>
        <td class="mono" style="font-size:12px">${fmtW(it.week)}</td>
          <td><div class="rowacts no-print">
  <button class="btn icon" title="Ver foto" data-img="${esc(it.ref)}" style="font-size:20px;line-height:1">📷</button>
  <button class="btn icon" title="Editar" data-ed="${it.id}" style="font-size:20px;line-height:1">✏️</button>
          <button class="btn icon danger" title="Eliminar" data-del="${it.id}" style="font-size:20px;line-height:1">🗑️</button>
        </div></td></tr>`;
    }).join('') : `<tr><td colspan="8"><div class="empty"><i data-lucide="inbox"></i><p>Sin resultados con los filtros actuales.</p></div></td></tr>`;
    icons();
    $$('#inv-tbody [data-ed]').forEach(b=>b.onclick=()=>editModal(b.dataset.ed,()=>{paintChips();paintRows();}));
    $$('#inv-tbody [data-del]').forEach(b=>b.onclick=()=>deleteModal(b.dataset.del,()=>{paintChips();paintRows();}));
    $$('#inv-tbody [data-img]').forEach(b=>b.onclick=()=>verImagen(b.dataset.img));
  };
  $('#fl-q').addEventListener('input',e=>{f.q=e.target.value;paintChips();paintRows();});
  $('#fl-week').onchange=e=>{f.week=e.target.value;vInv();};
  $('#fl-loc').onchange=e=>{f.loc=e.target.value;paintChips();paintRows();};
  $('#inv-csv').onclick=()=>{
    const rows=store.items.filter(i=>(!wk||i.week===wk)&&(f.loc==='all'||i.loc===f.loc)).map(itemRow);
    dlCSV(`gricol_inventario_${wk||'todo'}.csv`,[CSV_HEAD,...rows]);
    toast('CSV descargado.','ok','download');
  };
  paintChips(); paintRows();
}
function editModal(id,after){
  const it=store.items.find(i=>i.id===id); if(!it)return;
  openModal(`<div class="m-head"><i data-lucide="pencil"></i><h3>Editar ítem — ${esc(it.ref)}</h3>
    <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
  <div class="m-body"><div class="frows">
    <div class="field full"><label>Descripción</label><input class="input" id="m-desc" value="${esc(it.desc)}"></div>
    <div class="field"><label>Cantidad</label><input class="input num" id="m-qty" type="number" min="0" value="${it.qty}"></div>
    <div class="field"><label>Tipo</label><select class="input" id="m-tipo">${TIPOS.map(t=>`<option ${t===it.tipo?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Ubicación</label><select class="input" id="m-loc">${store.locs.map(l=>`<option ${l===it.loc?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="field"><label>Semana</label><select class="input" id="m-week">${[...new Set([it.week,nowWK(),...store.items.map(x=>x.week)])].sort((a,b)=>b.localeCompare(a)).map(w=>`<option ${w===it.week?'selected':''}>${w}</option>`).join('')}</select></div>
    <div class="field full"><label>Observaciones</label><textarea class="input" id="m-obs-edit">${esc(it.obs)}</textarea></div>
  </div></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn primary" id="m-save"><i data-lucide="check"></i> Guardar cambios</button></div>`);
  $('#m-save').onclick=()=>{
    const qty=Number($('#m-qty').value);
    if(isNaN(qty)||qty<0){toast('Cantidad inválida.','err');return;}
    Object.assign(it,{desc:$('#m-desc').value.trim()||'—',qty,tipo:$('#m-tipo').value,
      loc:$('#m-loc').value,week:$('#m-week').value,obs:$('#m-obs-edit').value.trim(),ts:Date.now()});
    store.items=[...store.items];
    logEvent('edición',`${it.ref} · modificado (${it.qty} und · ${it.loc} · ${it.week})`);
    closeModal(); toast('Cambios guardados.','ok','check'); after&&after();
  };
}
function deleteModal(id,after){
  const it=store.items.find(i=>i.id===id); if(!it)return;
  openModal(`<div class="m-head"><i data-lucide="trash-2"></i><h3>Eliminar ítem</h3>
    <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
  <div class="m-body">¿Eliminar <b class="mono">${esc(it.ref)}</b> — ${esc(it.desc)} (${it.qty} und · ${esc(it.loc)} · ${fmtW(it.week)})?<br>
  <span style="color:var(--mut);font-size:13px">Esta acción queda registrada en la bitácora y no se puede deshacer.</span></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn red" id="m-del"><i data-lucide="trash-2"></i> Eliminar</button></div>`);
  $('#m-del').onclick=()=>{
    store.items=store.items.filter(i=>i.id!==id);
    logEvent('baja',`${it.ref} · eliminado (${it.qty} und · ${it.week})`);
    closeModal(); toast('Ítem eliminado.','warn','trash-2'); after&&after();
  };
}

// ================= 04 · COMPARATIVO =================
function vCmp(){
  const wk=state.cmp.week, cmp=compareWeeks(wk);
  const weekOpts=[...new Set([nowWK(),...store.items.map(i=>i.week)])].sort((a,b)=>b.localeCompare(a));
  const delta=cmp.qB-cmp.qA;
  const outT = cmp.out.length? `<table>
    <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant. final</th><th>Última ubicación</th><th>Estado</th></tr></thead>
    <tbody>${outSorted(cmp.out).map(e=>`<tr>
      <td class="mono">${esc(e.ref)}</td><td>${esc(e.desc)}</td><td class="r mono num">${e.qty}</td>
      <td style="font-size:12.5px">${esc(e.loc)}</td>
      <td><span class="stamp sm c-release">Salida efectiva del inventario</span></td></tr>`).join('')}</tbody></table>`
    : `<div class="empty"><i data-lucide="check"></i><p>Todas las referencias de ${fmtW(cmp.prev)} continúan en ${fmtW(wk)}.</p></div>`;
  const innT = cmp.inn.length? `<table>
    <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant.</th><th>Ubicación</th><th>Clasificación</th></tr></thead>
    <tbody>${outSorted(cmp.inn).map(e=>{const c=classify(e.ref,e.tipo,wk,e.qty);return`<tr>
      <td class="mono">${esc(e.ref)}</td><td>${esc(e.desc)}</td><td class="r mono num">${e.qty}</td>
      <td style="font-size:12.5px">${esc(e.loc)}</td><td>${tagFor(c)}</td></tr>`}).join('')}</tbody></table>`
    : `<div class="empty"><i data-lucide="inbox"></i><p>Sin referencias nuevas frente a la semana anterior.</p></div>`;
  const chgT = cmp.chg.length? `<table>
    <thead><tr><th>Ref.</th><th>Cantidad</th><th>Ubicación</th></tr></thead>
    <tbody>${outSorted(cmp.chg).map(x=>`<tr>
      <td class="mono">${esc(x.ref)}<span class="sub">${esc(x.to.desc)}</span></td>
      <td class="mono num" style="font-size:12.5px">${x.from.qty} → <b>${x.to.qty}</b>
        ${x.from.qty!==x.to.qty?`<span class="delta ${x.to.qty>x.from.qty?'up':'down'}" style="margin-left:6px">${x.to.qty>x.from.qty?'+':''}${x.to.qty-x.from.qty}</span>`:''}</td>
      <td class="mono" style="font-size:12.5px">${esc(x.from.loc)} → <b>${esc(x.to.loc)}</b></td></tr>`).join('')}</tbody></table>`
    : `<div class="empty"><i data-lucide="minus"></i><p>Sin cambios en referencias continuas.</p></div>`;

  $('#view').innerHTML=secHead('04','Comparativo semanal','VS SEMANA ANTERIOR')+`
  <div class="cmp-head no-print">
    <span style="font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--mut)">SEMANA A COMPARAR</span>
    <select class="sel" id="cmp-week">${weekOpts.map(w=>`<option value="${w}" ${w===wk?'selected':''}>${fmtW(w)}${w===nowWK()?' — actual':''}</option>`).join('')}</select>
    <div class="cmp-arrow"><span class="wk">${fmtW(wk)}</span><i data-lucide="arrow-right"></i><span class="wk" style="background:#fff">${fmtW(cmp.prev)}</span></div>
    <span class="delta ${delta<0?'down':'up'}">${delta>=0?'+':''}${delta} UND</span>
  </div>
  <div class="warnline"><i data-lucide="alert-triangle" style="width:14px;height:14px;vertical-align:-2px"></i> No hay datos de la semana anterior (${fmtW(cmp.prev)}). El comparativo solo refleja la semana seleccionada.</div>
  <div class="band no-print">
    <div class="kpi"><div class="v num">${cmp.qA}</div><div class="l">Und. ${fmtW(cmp.prev)}</div></div>
    <div class="kpi"><div class="v num">${cmp.qB}</div><div class="l">Und. ${fmtW(wk)}</div></div>
    <div class="kpi"><div class="v num ${cmp.out.length?'alert':''}">${cmp.out.length}</div><div class="l">Salidas efectivas</div></div>
    <div class="kpi"><div class="v num">${cmp.inn.length}</div><div class="l">Ingresos nuevos</div></div>
    <div class="kpi"><div class="v num">${cmp.chg.length}</div><div class="l">Referencias con cambios</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx">A</span><h3>Salidas — referencias que ya no aparecen</h3>
      ${cmp.out.length?`<span class="stamp sm c-release">Salida efectiva del inventario</span>`:''}</div>
    <div class="tscroll">${outT}</div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx">B</span><h3>Ingresos nuevos de la semana</h3></div>
    <div class="tscroll">${innT}</div>
  </div>
  <div class="panel">
    <div class="panel-head"><span class="idx">C</span><h3>Cambios en referencias continuas</h3></div>
    <div class="tscroll">${chgT}</div>
  </div>`;
  icons();
  $('#cmp-week').onchange=e=>{state.cmp.week=e.target.value;vCmp();};
}

// ================= 05 · REPORTES =================
function vRep(){
  const r=state.rep, wk=r.week;
  const weekOpts=[...new Set(store.items.map(i=>i.week))].sort((a,b)=>b.localeCompare(a));
  const tabs=[['tipo','Por tipo'],['ubicacion','Por ubicación'],['alertas','Alertas de acción'],['excedentes','Excedentes'],['salidas','Salidas entre semanas'],['bitacora','Bitácora']];
  let body='';
  const groupTable=(key)=>{
    const map=new Map();
    for(const it of itemsOfWeek(wk)){
      const k=it[key]; if(!map.has(k))map.set(k,{refs:new Set(),qty:0});
      const e=map.get(k); e.refs.add(it.ref); e.qty+=Number(it.qty)||0;
    }
    const entries=[...map.entries()].sort((a,b)=>b[1].qty-a[1].qty);
    if(!entries.length) return `<div class="empty"><i data-lucide="inbox"></i><p>Sin datos en la semana ${wk}.</p></div>`;
    return entries.map(([k,e])=>`
      <div class="grp-head"><h4>${esc(k)}</h4><div class="gl"></div><span class="gc num">${e.refs.size} ref · ${e.qty} und</span></div>
      <div class="tscroll"><table>
        <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant.</th><th>Clasificación</th><th>${key==='loc'?'Tipo':'Ubicación'}</th></tr></thead>
        <tbody>${itemsOfWeek(wk).filter(i=>i[key]===k).sort((a,b)=>a.ref.localeCompare(b.ref)).map(it=>{
          const c=classify(it.ref,it.tipo,wk,it.qty);
          return `<tr><td class="mono">${esc(it.ref)}</td><td>${esc(it.desc)}</td><td class="r mono num">${it.qty}</td>
            <td>${tagFor(c)}</td><td style="font-size:12.5px">${esc(key==='loc'?it.tipo:it.loc)}</td></tr>`}).join('')}</tbody>
      </table></div>`).join('');
  };
  if(r.tab==='tipo') body=groupTable('tipo');
  else if(r.tab==='ubicacion') body=groupTable('loc');
  else if(r.tab==='alertas'){
    const rows=itemsOfWeek(wk).map(it=>({it,c:classify(it.ref,it.tipo,wk,it.qty)})).filter(x=>x.c.kind==='move'||x.c.kind==='release');
    body=rows.length? `<div class="tscroll"><table>
      <thead><tr><th>Ref.</th><th class="r">Cant.</th><th>Ubicación</th><th>Acción</th><th>Motivo</th><th>Sem. en bodega</th></tr></thead>
      <tbody>${rows.map(({it,c})=>`<tr><td class="mono">${esc(it.ref)}<span class="sub">${esc(it.desc)}</span></td>
        <td class="r mono num">${it.qty}</td><td style="font-size:12.5px">${esc(it.loc)}</td>
        <td>${tagFor(c)}</td><td style="font-size:12.5px;color:var(--mut)">${esc(c.reason)}</td>
        <td class="mono num" style="font-size:12px">${c.weeks??'—'}${c.weeks!=null?' sem':''}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6">${rows.length} ÍTEM(ES) REQUIEREN ACCIÓN</td></tr></tfoot></table></div>`
      : `<div class="empty"><i data-lucide="check"></i><p>Ningún ítem requiere traslado ni liberación en la semana ${wk}.</p></div>`;
  }
  else if(r.tab==='excedentes'){
    const rows=itemsOfWeek(wk).map(it=>({it,c:classify(it.ref,it.tipo,wk,it.qty)})).filter(x=>x.c.excedente>0);
    body=rows.length? `<div class="tscroll"><table>
      <thead><tr><th>Ref.</th><th class="r">Cant. total</th><th class="r">Base</th><th class="r">Excedente</th><th>Ubicación</th><th>Acción</th></tr></thead>
      <tbody>${rows.map(({it,c})=>`<tr><td class="mono">${esc(it.ref)}<span class="sub">${esc(it.desc)}</span></td>
        <td class="r mono num">${it.qty}</td><td class="r mono num">${c.cantidadBase}</td>
        <td class="r mono num" style="color:var(--amber);font-weight:700">${c.excedente}</td>
        <td style="font-size:12.5px">${esc(it.loc)}</td>
        <td><span class="tag t-excess">Liberar ${c.excedente} und</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6">${rows.length} REFERENCIA(S) CON EXCEDENTE</td></tr></tfoot></table></div>`
      : `<div class="empty"><i data-lucide="check"></i><p>Sin excedentes en la semana ${wk}.</p></div>`;
  }
  else if(r.tab==='salidas'){
    const cmp=compareWeeks(wk);
    body=cmp.out.length? `<div class="tscroll"><table>
      <thead><tr><th>Ref.</th><th>Descripción</th><th class="r">Cant. que salió</th><th>Última ubicación</th><th>Estado</th></tr></thead>
      <tbody>${outSorted(cmp.out).map(e=>`<tr><td class="mono">${esc(e.ref)}</td><td>${esc(e.desc)}</td>
        <td class="r mono num">${e.qty}</td><td style="font-size:12.5px">${esc(e.loc)}</td>
        <td><span class="stamp sm c-release">Salida efectiva del inventario</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="5">${cmp.out.length} REFERENCIA(S) SALIERON · ${fmtW(cmp.prev)} → ${fmtW(wk)}</td></tr></tfoot>
    </table></div>`
    : `<div class="empty"><i data-lucide="check"></i><p>Sin salidas entre ${fmtW(cmp.prev)} y ${fmtW(wk)}.</p></div>`;
  }
  else {
    const L=store.log;
    body=L.length? L.slice(0,40).map(e=>`<div class="logline"><span class="lt">${fmtTs(e.ts)}</span>
      <span class="lk a-${e.type}">${esc(e.type)}</span><span class="lm">${esc(e.msg)}</span></div>`).join('')
      : `<div class="empty"><i data-lucide="history"></i><p>Sin registros aún.</p></div>`;
  }
  $('#view').innerHTML=secHead('05','Reportes y alertas',fmtW(wk))+`
  <div class="filters no-print">
    <select class="sel" id="rep-week">${weekOpts.map(w=>`<option value="${w}" ${w===wk?'selected':''}>${fmtW(w)}${w===nowWK()?' — actual':''}</option>`).join('')}</select>
    <div class="spacer" style="flex:1"></div>
    <button class="btn small" id="rep-csv-wk"><i data-lucide="file-spreadsheet"></i> CSV semana</button>
    <button class="btn small" id="rep-csv-all"><i data-lucide="download"></i> CSV todo</button>
    <button class="btn small" id="rep-print"><i data-lucide="printer"></i> Imprimir</button>
  </div>
  <div class="subnav no-print">${tabs.map(([k,l])=>`<button data-t="${k}" class="${r.tab===k?'on':''}">${l}</button>`).join('')}</div>
  ${body}`;
  icons();
  $('#rep-week').onchange=e=>{r.week=e.target.value;vRep();};
  $$('.subnav button').forEach(b=>b.onclick=()=>{r.tab=b.dataset.t;vRep();});
  $('#rep-csv-wk').onclick=()=>{dlCSV(`gricol_reporte_${wk}.csv`,[CSV_HEAD,...itemsOfWeek(wk).map(itemRow)]);toast('CSV de la semana descargado.','ok','download');};
  $('#rep-csv-all').onclick=()=>{dlCSV('gricol_inventario_completo.csv',[CSV_HEAD,...store.items.map(itemRow)]);toast('CSV completo descargado.','ok','download');};
  $('#rep-print').onclick=()=>window.print();
}

// ================= 06 · AJUSTES =================
function vSet(){
  $('#view').innerHTML=secHead('06','Ajustes','CONFIGURACIÓN LOCAL')+`
  <div class="set-grid">
    <div class="panel"><div class="panel-head"><span class="idx">A</span><h3>Cuenta de acceso</h3></div>
      <div class="panel-body">
        <p style="font-size:13.5px;margin-bottom:16px">Usuario actual: <b class="mono">${esc(store.auth.user)}</b></p>
        <form id="f-pass"><div class="frows">
          <div class="field full"><label>Contraseña actual</label><input class="input" type="password" id="p-old" autocomplete="current-password"></div>
          <div class="field"><label>Nueva contraseña</label><input class="input" type="password" id="p-new" autocomplete="new-password"></div>
          <div class="field"><label>Repetir nueva</label><input class="input" type="password" id="p-new2" autocomplete="new-password"></div>
        </div>
        <button class="btn primary" style="margin-top:18px"><i data-lucide="key-round"></i> Cambiar contraseña</button></form>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">B</span><h3>Regla de antigüedad</h3></div>
      <div class="panel-body">
        <p style="font-size:13.5px;margin-bottom:14px">Las referencias sin clasificar que acumulen este número de semanas en bodega pasan automáticamente a <b>LIBERAR</b>; antes de ese umbral se sugiere <b>TRASLADAR</b>.</p>
        <div class="field" style="max-width:220px"><label>Semanas para liberar</label>
          <input class="input num" type="number" min="1" max="20" id="cfg-th" value="${store.cfg.threshold}"></div>
        <button class="btn primary" style="margin-top:16px" id="cfg-save"><i data-lucide="check"></i> Guardar umbral</button>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">C</span><h3>Ubicaciones</h3></div>
      <div class="panel-body">
        <div class="loc-chips" id="loc-chips">${store.locs.map(l=>`<span class="loc-chip">${esc(l)}
          <button data-l="${esc(l)}" title="Quitar"><i data-lucide="x"></i></button></span>`).join('')}</div>
        <div class="addrrow"><input class="input" id="loc-new" placeholder="Nueva ubicación…">
          <button class="btn small" id="loc-add"><i data-lucide="plus"></i> Añadir</button></div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">D</span><h3>Catálogo de cantidades estándar</h3></div>
      <div class="panel-body">
        <p style="font-size:13px;margin-bottom:12px;color:var(--mut)">Define la cantidad estándar de cada referencia. Si al ingresar hay más unidades, el excedente se marca como <b>LIBERAR</b>.</p>
        <div id="cat-list">${Object.keys(store.catalogo).length? Object.entries(store.catalogo).sort((a,b)=>a[0].localeCompare(b[0])).map(([ref,qty])=>`
          <div class="catrow" data-ref="${esc(ref)}">
            <span class="cr">${esc(ref)}</span>
            <input class="input num" type="number" min="0" value="${qty}" data-cat-qty>
            <span class="ct">und</span>
            <button class="btn icon danger" data-cat-del title="Eliminar"><i data-lucide="trash-2"></i></button>
          </div>`).join('') : `<p style="color:var(--mut);font-size:13px">Sin referencias en el catálogo.</p>`}</div>
        <div class="addrrow" style="margin-top:14px">
          <input class="input mono" id="cat-new-ref" placeholder="IMP-0450 / ENS-0088 / FIJ-1201" style="text-transform:uppercase">
          <input class="input num" id="cat-new-qty" type="number" min="0" placeholder="Cant." style="max-width:110px">
          <button class="btn small" id="cat-add"><i data-lucide="plus"></i> Añadir</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <button class="btn small" id="cat-csv"><i data-lucide="download"></i> Exportar catálogo</button>
          <button class="btn small" id="cat-saveall"><i data-lucide="check"></i> Guardar cambios</button>
          <button class="btn small" id="cat-sync"><i data-lucide="refresh-cw"></i> Sincronizar catálogo desde inventario</button>
        </div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">E</span><h3>Referencias fijas (se repiten solas)</h3></div>
      <div class="panel-body">
        <p style="font-size:13px;margin-bottom:12px;color:var(--mut)">Las referencias registradas aquí se <b>repiten automáticamente</b> cada semana con la cantidad del catálogo.</p>
        <div id="fijas-list">${Object.keys(store.fijas).length? Object.entries(store.fijas).map(([ref,meta])=>`
          <div class="catrow" data-fija-ref="${esc(ref)}" style="grid-template-columns:1fr 1fr 40px">
            <span class="cr">${esc(ref)}</span>
            <span style="font-size:12px;color:var(--mut)">${esc(meta.desc||'—')}</span>
            <button class="btn icon danger" data-fija-del title="Quitar"><i data-lucide="trash-2"></i></button>
          </div>`).join('') : `<p style="color:var(--mut);font-size:13px">Sin referencias fijas registradas.</p>`}</div>
        <div class="addrrow" style="margin-top:14px">
          <input class="input mono" id="fija-new-ref" placeholder="FIJ-1201" style="text-transform:uppercase">
          <input class="input" id="fija-new-desc" placeholder="Descripción">
          <button class="btn small" id="fija-add"><i data-lucide="plus"></i> Añadir</button>
        </div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><span class="idx">F</span><h3>Datos</h3></div>
      <div class="panel-body">
        <p style="font-size:13.5px;margin-bottom:16px">Respalda o restablece la información guardada en este navegador.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn small" id="d-exp"><i data-lucide="download"></i> Respaldo JSON</button>
          <button class="btn small" id="d-imp-btn"><i data-lucide="file-up"></i> Importar respaldo</button>
          <input type="file" id="d-imp" accept=".json" hidden>
          <button class="btn small" id="d-seed"><i data-lucide="database"></i> Cargar ejemplo</button>
          <button class="btn small red" id="d-wipe"><i data-lucide="trash-2"></i> Borrar todo</button>
        </div>
      </div>
    </div>
  </div>
  <div class="panel"><div class="panel-head"><span class="idx">G</span><h3>Reglas de clasificación automática</h3></div>
    <div class="panel-body"><ul class="alist">
      ${RULES_TXT.map((t,i)=>`<li><span class="ix">R${i+1}</span><div class="body"><div class="why" style="margin:0;font-size:13.5px;color:var(--ink)">${esc(t)}</div></div></li>`).join('')}
    </ul>
    <p style="font-size:12.5px;color:var(--mut);margin-top:12px">R1–R3 clasifican por prefijo. Si la referencia está en el catálogo, se compara la cantidad: excedente → LIBERAR, faltante → solo aviso. R4 aplica a referencias sin prefijo especial, según antigüedad.</p></div>
  </div>`;
  icons();
  // --- Password
  $('#f-pass').onsubmit=e=>{
    e.preventDefault();
    const a=store.auth;
    if(b64($('#p-old').value)!==a.hash){toast('La contraseña actual no coincide.','err');return;}
    if($('#p-new').value.length<4){toast('La nueva contraseña debe tener al menos 4 caracteres.','err');return;}
    if($('#p-new').value!==$('#p-new2').value){toast('Las contraseñas nuevas no coinciden.','err');return;}
    store.auth={...a,hash:b64($('#p-new').value)};
    logEvent('sesión','Cambio de contraseña de '+a.user);
    toast('Contraseña actualizada.','ok','key-round'); vSet();
  };
  // --- Umbral
  $('#cfg-save').onclick=()=>{
    const th=Math.max(1,Math.min(20,Number($('#cfg-th').value)||3));
    store.cfg={threshold:th}; toast(`Umbral actualizado: ${th} semanas para liberar.`,'ok','check');
  };
  // --- Ubicaciones
  const paintLocs=()=>{
    $('#loc-chips').innerHTML=store.locs.map(l=>`<span class="loc-chip">${esc(l)}
      <button data-l="${esc(l)}"><i data-lucide="x"></i></button></span>`).join('');
    $$('#loc-chips button').forEach(b=>b.onclick=()=>{
      store.locs=store.locs.filter(x=>x!==b.dataset.l);
      toast(`Ubicación "${b.dataset.l}" eliminada.`,'warn','map-pin'); vSet();
    });
    icons();
  };
  $('#loc-add').onclick=()=>{
    const v=$('#loc-new').value.trim(); if(!v)return;
    if(store.locs.includes(v)){toast('Esa ubicación ya existe.','err');return;}
    store.locs=[...store.locs,v]; $('#loc-new').value='';
    toast('Ubicación añadida.','ok','map-pin'); vSet();
  };
  paintLocs();
  // --- Catálogo
  const catSaveAll=()=>{
    const cat={...store.catalogo};
    $$('#cat-list [data-cat-qty]').forEach(inp=>{
      const row=inp.closest('.catrow'); const ref=row.dataset.ref;
      const v=Number(inp.value);
      if(!isNaN(v)&&v>=0) cat[ref]=v;
    });
    store.catalogo=cat; toast('Catálogo guardado.','ok','check');
  };
  $$('#cat-list [data-cat-del]').forEach(b=>b.onclick=()=>{
    const ref=b.closest('.catrow').dataset.ref;
    const cat={...store.catalogo}; delete cat[ref]; store.catalogo=cat;
    toast(`Referencia ${ref} quitada del catálogo.`,'warn','trash-2'); vSet();
  });
  $('#cat-add').onclick=()=>{
    const ref=$('#cat-new-ref').value.trim().toUpperCase();
    const qty=Number($('#cat-new-qty').value);
    if(!ref||isNaN(qty)||qty<0){toast('Referencia y cantidad válidas requeridas.','err');return;}
    const cat={...store.catalogo}; cat[ref]=qty; store.catalogo=cat;
    toast(`Añadido al catálogo: ${ref} = ${qty} und.`,'ok','check'); vSet();
  };
  $('#cat-saveall').onclick=catSaveAll;
  $('#cat-csv').onclick=()=>{
    const rows=[['Referencia','Cantidad estándar'],...Object.entries(store.catalogo).map(([r,q])=>[r,q])];
    dlCSV('gricol_catalogo.csv',rows); toast('Catálogo exportado.','ok','download');
  };
  $('#cat-sync').onclick=()=>{
  const wk=nowWK();
  const items=itemsOfWeek(wk);
  if(!items.length){ toast('No hay inventario en la semana actual.','warn','alert-triangle'); return; }
  const cat={...store.catalogo};
  let actualizadas=0;
  for(const it of items){
    if(cat[it.ref]!=null && cat[it.ref]!==it.qty){ cat[it.ref]=Number(it.qty); actualizadas++; }
  }
  store.catalogo=cat;
  logEvent('catálogo',`Sincronizado desde inventario semana ${wk}: ${actualizadas} referencia(s) actualizada(s)`);
  toast(`Catálogo sincronizado: ${actualizadas} referencia(s) actualizada(s).`,'ok','refresh-cw');
  vSet();
};
  // --- Fijas
  $$('#fijas-list [data-fija-del]').forEach(b=>b.onclick=()=>{
    const ref=b.closest('.catrow').dataset.fijaRef;
    const f={...store.fijas}; delete f[ref]; store.fijas=f;
    toast(`Fija ${ref} eliminada.`,'warn','trash-2'); vSet();
  });
  $('#fija-add').onclick=()=>{
    const ref=$('#fija-new-ref').value.trim().toUpperCase();
    const desc=$('#fija-new-desc').value.trim();
    if(!ref){toast('La referencia es obligatoria.','err');return;}
    const f={...store.fijas}; f[ref]={desc,tipo:'Materia prima',loc:store.locs[0]||''};
    store.fijas=f;
    if(!store.catalogo[ref]){ const cat={...store.catalogo}; cat[ref]=0; store.catalogo=cat; }
    toast(`Fija ${ref} registrada. Define su cantidad en el catálogo.`,'ok','pin'); vSet();
  };
  // --- Datos
  $('#d-exp').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify({items:store.items,locs:store.locs,cfg:store.cfg,log:store.log,catalogo:store.catalogo,fijas:store.fijas},null,2)],{type:'application/json'}));
    a.download='gricol_respaldo.json'; a.click(); URL.revokeObjectURL(a.href);
    toast('Respaldo descargado.','ok','download');
  };
  $('#d-imp-btn').onclick=()=>$('#d-imp').click();
  $('#d-imp').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.items)) throw 0;
      store.items=d.items; if(Array.isArray(d.locs))store.locs=d.locs;
      if(d.cfg)store.cfg=d.cfg; if(Array.isArray(d.log))store.log=d.log;
      if(d.catalogo)store.catalogo=d.catalogo; if(d.fijas)store.fijas=d.fijas;
      toast(`Respaldo importado: ${d.items.length} líneas.`,'ok','check'); vSet();
    }catch{toast('El archivo no es un respaldo válido.','err');}};
    rd.readAsText(f);
  };
  $('#d-seed').onclick=()=>{
    openModal(`<div class="m-head"><i data-lucide="database"></i><h3>Cargar datos de ejemplo</h3>
      <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="m-body">Se reemplazará el inventario actual por un conjunto de demostración. ¿Continuar?</div>
      <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" id="m-seed"><i data-lucide="database"></i> Cargar</button></div>`);
    $('#m-seed').onclick=()=>{
      lsRawDel('gricol_seeded'); store.items=[]; store.catalogo={}; store.fijas={};
      seedDemo(); closeModal(); toast('Datos de ejemplo cargados.','ok','database'); vSet();
    };
  };
  $('#d-wipe').onclick=()=>{
    openModal(`<div class="m-head"><i data-lucide="trash-2"></i><h3>Borrar todos los datos</h3>
      <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="m-body">Se eliminarán <b>todos los ítems</b>, el catálogo, las fijas y la bitácora. ¿Continuar?</div>
      <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn red" id="m-wipe"><i data-lucide="trash-2"></i> Borrar todo</button></div>`);
    $('#m-wipe').onclick=()=>{
      store.items=[]; store.log=[]; store.catalogo={}; store.fijas={}; lsRawDel('gricol_seeded');
      closeModal(); toast('Inventario vacío.','warn','trash-2'); setView('dashboard');
    };
  };
}

// ---------- Arranque ----------
  function verImagen(ref){
  const refSafe=String(ref||'').toUpperCase();
  const url=IMG_BASE+encodeURIComponent(refSafe)+'.png';
  openModal(`<div class="m-head"><i data-lucide="image"></i><h3>Foto — ${esc(ref)}</h3>
    <button class="btn icon" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="m-body" style="text-align:center">
      <img src="${url}" alt="${esc(ref)}" style="max-width:100%;max-height:70vh;border:2px solid var(--ink)"
        onerror="this.onerror=null;this.src=IMG_BASE+encodeURIComponent('${refSafe}')+'.jpg';this.onerror=function(){this.style.display='none';this.parentNode.innerHTML='<p style=&quot;color:var(--mut);padding:40px&quot;>No hay foto para esta referencia.<br>Sube la imagen como <b>${esc(refSafe)}.png</b> o <b>${esc(refSafe)}.jpg</b> a la carpeta <b>imagenes/</b> del repositorio.</p>';}">
    </div>
    <div class="m-foot"><button class="btn" onclick="closeModal()">Cerrar</button></div>`);
}
if(sessGet()) renderApp(); else renderLogin();
</script>
</body>
</html>
